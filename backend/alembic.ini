; Alembic configuration — multi-version directory per ADR-024 bounded contexts.
;
; Phase 00.1: config skeleton. Реальные migrations + bounded-context subdirs
; (iam, multitenancy, billing, agents, artifacts, llm-gateway, mcp, memory,
; rbac, tasks) появляются в Phase 00.3.
;
; Usage:
;   uv run alembic upgrade head              # apply all pending migrations
;   uv run alembic revision -m "msg"         # create new revision (default branch)
;   uv run alembic revision --branch-label iam -m "msg"  # specific bounded context

[alembic]
script_location = migrations
prepend_sys_path = . src

; Multi-version: каждый bounded context = independent linear history per ADR-024.
; Paths добавляются по мере появления doменов; Phase 00.1 — только default.
version_locations = %(here)s/migrations/versions
version_path_separator = space

; Async-compatible — env.py использует AsyncEngine
sqlalchemy.url = postgresql+asyncpg://oriion:oriion-dev@localhost:5432/oriion_dev

; Файл naming: timestamp + rev + slug
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s
timezone = UTC

; Auto-format generated revision files через ruff
[post_write_hooks]
hooks = ruff_format
ruff_format.type = console_scripts
ruff_format.entrypoint = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

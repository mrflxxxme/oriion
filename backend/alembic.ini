; Alembic configuration — multi-version directory per ADR-024 bounded contexts.
;
; Phase 00.1: config skeleton. Real migrations + bounded-context subdirs
; (iam, multitenancy, billing, agents, artifacts, llm-gateway, mcp, memory,
; rbac, tasks) materialize in Phase 00.2+.
;
; Usage:
;   uv run alembic upgrade head              # apply all pending migrations
;   uv run alembic revision -m "msg"         # create new revision (default branch)
;   uv run alembic revision --branch-label iam -m "msg"  # specific bounded context
;
; Note (Phase 00.6 Commit 2): UTF-8 read is enforced by backend/migrations/
; env.py, which shadows Alembic's memoized Config.file_config with a parser
; pre-loaded via explicit encoding="utf-8" (sidesteps configparser's default
; locale=cp1251 on Windows ru-RU). Non-ASCII commentary в этом файле теперь
; безопасно — env.py гарантирует корректное чтение независимо от системной
; локали. Carryover removed from HANDOFF.md Pitfalls list.

[alembic]
script_location = migrations
prepend_sys_path = . src

; Multi-version: each bounded context = independent linear history per ADR-024.
; Architect-PR (pre-Phase-00.2) opened the `_shared` foundation branch + all
; bounded-context subdirs to unblock 3-way parallel execution of Phases 00.2 /
; 00.3 / 00.4. Each phase materializes its own context migrations under the
; corresponding subdirectory below; `_shared/0001_init.py` is the `down_revision`
; foundation that every context's first migration chains onto.
version_locations = %(here)s/migrations/versions/_shared %(here)s/migrations/versions/iam %(here)s/migrations/versions/multitenancy %(here)s/migrations/versions/audit %(here)s/migrations/versions/billing %(here)s/migrations/versions/llm_gateway %(here)s/migrations/versions/rbac %(here)s/migrations/versions/agents %(here)s/migrations/versions/tasks %(here)s/migrations/versions/artifacts %(here)s/migrations/versions/memory %(here)s/migrations/versions/mcp
version_path_separator = space

; Async-compatible — env.py uses AsyncEngine.
; URL is INTENTIONALLY empty: env.py must read DATABASE_URL from the
; environment (see backend/migrations/env.py). This protects against
; accidentally running migrations against hardcoded localhost when
; DATABASE_URL is not set.
sqlalchemy.url =

; File naming: timestamp + rev + slug
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s
timezone = UTC

; Auto-format generated revision files via ruff
[post_write_hooks]
hooks = ruff_format
ruff_format.type = console_scripts
ruff_format.entrypoint = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

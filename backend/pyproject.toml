[project]
name = "teamly-backend"
version = "0.1.0"
description = "TEAMLY_RU backend — Pydantic-AI agent runtime + FastAPI + SQLAlchemy"
# readme field intentionally omitted — Phase 00.6 Commit 7 prod Dockerfile
# uses `backend/` as Docker build context, so `../README.md` resolves outside
# context и hatchling validate_fields raises OSError при `uv sync --frozen`.
# Repository README lives в worktree root (../README.md) for git tooling but
# isn't needed inside the Python wheel metadata for a private image.
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "Kirill Uklonskiy", email = "uklonskiy.k@gmail.com" }]

dependencies = [
    # FastAPI 0.120+ ships starlette ≥0.49.1 (fixes CVE-2025-54121, CVE-2025-62727).
    "fastapi>=0.120,<0.130",
    "uvicorn[standard]>=0.35,<0.40",  # bump to satisfy fastmcp >=3.2.0 (security)
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "sqlalchemy[asyncio]>=2.0.36,<3.0",
    "asyncpg>=0.30,<0.31",
    "alembic>=1.14,<2.0",
    "redis>=5.2,<6.0",
    "dramatiq[redis]>=1.17,<2.0",
    "httpx>=0.28,<0.29",
    "PyJWT[crypto]>=2.10,<3.0",
    "argon2-cffi>=23.1,<24.0",
    "structlog>=24.4,<25.0",
    "email-validator>=2.2,<3.0",
    # Phase 00.4 — LLM Gateway + MCP tools
    "cryptography>=48.0.1,<49.0",     # AES-256-GCM for LocalAESKMS (>=48.0.1 fixes GHSA-537c-gmf6-5ccf; prior >=46.0.6 fixed CVE-2026-26007 + CVE-2026-34073)
    # Transitive security floors — CVE drift 2026-06, fixes available (pin direct):
    "aiohttp>=3.14.1",                # CVE-2026-54273..54280 (8) fixed in 3.14.1
    "python-multipart>=0.0.31",       # CVE-2026-53538/53539/53540 fixed in 0.0.30/0.0.31 (transitive via starlette)
    "openai>=2.29,<3.0",              # bumped to satisfy pydantic-ai >=1.56 (security)
    "readability-lxml>=0.8,<1.0",     # MCP read_url tool main-content extraction
    "lxml>=6.1,<7.0",                 # readability-lxml dep (>=6.1 fixes CVE-2026-41066)
    "tenacity>=9.0,<10.0",            # circuit-breaker / retry decorators
    "pgvector>=0.3,<0.5",             # SQLAlchemy Vector column type (pgvector helper)
    # Phase 00.5b post-PR-CI fix: bump to >=1.56.0 closes CVE-2026-25580; also
    # transitively pulls fastmcp >=3.2.0 which closes 3 fastmcp CVEs at once
    # (GHSA-rcfx-77hg-w2wv, CVE-2025-69196, CVE-2025-64340, CVE-2026-27124).
    "pydantic-ai>=1.56.0",
    "fastmcp>=3.2.0",
    # Phase 00.6 — observability stack. pydantic-ai pulls opentelemetry-api/sdk
    # transitively; we pin explicit versions for our own setup_otel() control
    # and add auto-instrumentation + OTLP gRPC exporter + prometheus_client.
    "opentelemetry-api>=1.39,<2.0",
    "opentelemetry-sdk>=1.39,<2.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.39,<2.0",
    "opentelemetry-instrumentation-fastapi>=0.60b0",
    "opentelemetry-instrumentation-httpx>=0.60b0",
    "opentelemetry-instrumentation-asyncpg>=0.60b0",
    "prometheus-client>=0.21,<0.22",
    "gunicorn>=26.0.0",
    # AC-W1-14 — audit_log cold-storage archival to RU Object Storage (S3-compatible).
    "boto3>=1.35,<2.0",
    "pycrdt>=0.12,<0.13",
]

[dependency-groups]
dev = [
    "pytest>=9.0,<10.0",
    "pytest-asyncio>=1.0,<2.0",
    "pytest-cov>=7.0,<8.0",
    "ruff>=0.7,<0.8",
    "mypy>=1.13,<2.0",
    "bandit[toml]>=1.7,<2.0",
    "pip-audit>=2.7,<3.0",
    "pip-licenses>=5.0,<6.0",
    "docker>=7.1,<8.0",
    # Phase 00.3/00.4 — testcontainers PG + HTTP mocking
    "testcontainers[postgres]>=4.9,<5.0",
    "pytest-postgresql>=6.1,<8.0",   # fallback when testcontainers unavailable
    "psycopg[binary]>=3.2,<4.0",     # libpq binary wheel for pytest-postgresql/testcontainers
    "respx>=0.22,<0.23",             # httpx mocking for provider integration tests
    "pytest-httpx>=0.36,<0.40",      # alternative httpx mocking (>=0.36 requires pytest 9.x)
    "fakeredis[lua]>=2.26,<3.0",     # in-memory Redis fake for rate-limit tests
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "ARG", # flake8-unused-arguments
    "RUF", # ruff-specific
    "S",   # bandit-lite
    "N",   # pep8-naming
]
ignore = [
    "E501",  # line-too-long — formatter handles
    "S101",  # use-of-assert — fine in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S", "ARG"]
# Domain-exception names follow phase-spec naming (no Error suffix) per ADR-024
# contract conformance — exceptions surface as error codes, not class names.
"**/exceptions.py" = ["N818"]
# FastAPI idiom: Depends() / Header() in argument defaults is the canonical pattern.
"**/routers/**" = ["B008"]
"**/middleware.py" = ["B008"]
"**/middleware/**" = ["B008"]
"**/deps.py" = ["B008"]
# Protocol implementations + anti-enum stubs intentionally ignore some args
# (NoOpEmailSender drops token/expires_at; resend/forgot ignore user_agent
# since rate-limit is keyed on email only).
"**/email_service.py" = ["ARG002"]
"**/auth_service.py" = ["ARG002"]
"**/account_recovery_service.py" = ["ARG002"]
# Phase 00.5b: canned RU content for the «Market & content brief» demo.
# Cyrillic + Latin lookalikes are intentional content, not code style noise.
"tests/_fixtures/canned_pydantic_ai/*.py" = ["RUF001", "RUF002", "RUF003"]
# Phase 00.6 Commits 10/11/13: mixed Russian + English commentary в new
# tests/tasks/, tests/runtime/, tests/_shared/observability/ docstrings
# matches project documentation idiom (HANDOFF.md + audit reports use
# the same blend). Extends precedent from canned_pydantic_ai fixture.
"tests/tasks/*.py" = ["RUF001", "RUF002", "RUF003"]
"tests/runtime/*.py" = ["RUF001", "RUF002", "RUF003"]
"tests/_shared/observability/*.py" = ["RUF001", "RUF002", "RUF003"]
# Phase 00.6 PR-B: demo-script tests embed RU artifact fixtures (matrix rows,
# content-plan posts) to exercise AC9 parsing — same content rationale.
"tests/scripts/*.py" = ["RUF001", "RUF002", "RUF003"]
# dispatch.py carries RU LLM-facing content (the web_search result header +
# plan-execution sub-prompt chaining), not code-style noise — same rationale
# as the canned_pydantic_ai fixture above.
"src/runtime/dispatch.py" = ["RUF001"]
# 01.4b: memory_curator.py carries the RU LLM-facing filter/summarizer system
# prompts — intentional content, same rationale as dispatch.py above.
"src/agents/memory_curator.py" = ["RUF001"]
# Phase 00.6 PR-B: demo_market_brief carries the RU demo prompt + RU-facing
# docstring (gate evidence collector) — intentional content, not style noise.
"scripts/*.py" = ["RUF001", "RUF002", "RUF003"]
# AC-W1-3 (Master-Agent): agents tests + the agency-marketing seed embed RU
# domain content mixed with Latin terms (CEO/COO, «deliverable») — confusable
# chars are intentional content, same rationale as canned_pydantic_ai above.
"tests/agents/*.py" = ["RUF001", "RUF002", "RUF003"]
"src/agents/seed_data/agency_marketing_ru_v1.py" = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "dramatiq.*",
    "argon2.*",
    "lxml.*",
    "readability.*",
    "testcontainers.*",
    "fakeredis.*",
    "pgvector.*",
    "yaml",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Phase 00.2.5 (2026-05-19) revisited: the Phase 00.2.5 launch checklist
# proposed flipping this back to "session" together with the testcontainers
# upgrade. That recommendation is incompatible with asyncpg's loop-binding
# constraint — an engine created in the session loop crashes with "Future
# attached to a different loop" when consumed by a function-loop test
# (which is what pytest-asyncio creates per @pytest.mark.asyncio test).
#
# Resolution: keep "function" loop scope. The expensive part of integration
# setup — the testcontainers PG container — is session-scoped in
# `tests/conftest.py::pg_container`. The cheap part — the async engine —
# is created/disposed per test (~10ms each, negligible vs container boot).
# SAVEPOINT-rollback isolation in `db_session` works within a function-
# scoped engine because both the connection and the SAVEPOINT live in the
# same loop.
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--strict-markers -ra -m 'not live and not integration'"
markers = [
    "integration: integration tests requiring docker-compose stack or testcontainers (deselect with '-m \"not integration\"')",
    "live: tests that hit real LLM provider APIs — require env keys (default: skipped via addopts)",
    "commit_required: tests that need real COMMITs (cross-TX visibility, after-COMMIT triggers, partition routing observation) — use `db_session_committed` instead of `db_session`",
]
# Promote warnings to errors so the suite never silently grows noise.
# Add narrow ignores below if a third-party deprecation can't be avoided.
filterwarnings = [
    "error",
    # alembic 1.16+ deprecated `version_path_separator` in favour of
    # `path_separator`. alembic.ini still uses the old key because
    # programmatic override breaks `version_locations` parsing (space-
    # separated; `path_separator=os` would force ; on Windows / : on
    # Unix and collapse all 12 bounded-context locations into one bogus
    # path). Phase 00.6 owns the alembic.ini rewrite once the cp1251
    # issue (HANDOFF.md:120) is cleared.
    "ignore:No path_separator found in configuration:DeprecationWarning:alembic",
    "ignore:The version_path_separator configuration parameter is deprecated:DeprecationWarning:alembic",
    # Phase 00.5b: pydantic-ai 1.30 imports opentelemetry._events.NoOpEventLogger
    # which subclasses EventLogger; opentelemetry 1.39+ marks EventLogger as
    # deprecated in favour of Logger. Upstream pydantic-ai fix tracked at
    # https://github.com/pydantic/pydantic-ai (issue not yet filed by us —
    # Wave 1 task). The warning fires at import-time inside opentelemetry,
    # not via our code, so we ignore the module-keyed pattern.
    "ignore:You should use .[A-Za-z]+. instead. Deprecated since version 1\\.39\\.0:DeprecationWarning",
    # Windows-only pytest-asyncio GC artifact: a per-function event loop that is
    # garbage-collected without an explicit close() emits a ResourceWarning
    # (the unclosed loop + its self-pipe socketpair); pytest's
    # `unraisableexception` plugin re-raises it as a PytestUnraisableExceptionWarning
    # at the NEXT test's *setup*, which `error` then escalates to a spurious
    # ERROR. It is a GC-timing artifact of pytest-asyncio on the Windows
    # ProactorEventLoop, NOT a leak in our code — surfaced first by the mixed
    # unit+integration `tests/memory` run. Linux CI (SelectorEventLoop) does not
    # hit it. Scoped to the "Exception ignored in:" GC message only.
    "ignore:Exception ignored in:pytest.PytestUnraisableExceptionWarning",
]

[tool.coverage.run]
source = ["src"]
branch = true
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 70
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]

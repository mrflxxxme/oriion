[project]
name = "teamly-backend"
version = "0.1.0"
description = "TEAMLY_RU backend — Pydantic-AI agent runtime + FastAPI + SQLAlchemy"
readme = "../README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "Kirill Uklonskiy", email = "uklonskiy.k@gmail.com" }]

dependencies = [
    # FastAPI 0.120+ ships starlette ≥0.49.1 (fixes CVE-2025-54121, CVE-2025-62727).
    "fastapi>=0.120,<0.130",
    "uvicorn[standard]>=0.32,<0.33",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "sqlalchemy[asyncio]>=2.0.36,<3.0",
    "asyncpg>=0.30,<0.31",
    "alembic>=1.14,<2.0",
    "redis>=5.2,<6.0",
    "dramatiq[redis]>=1.17,<2.0",
    "httpx>=0.28,<0.29",
    "PyJWT[crypto]>=2.10,<3.0",
    "argon2-cffi>=23.1,<24.0",
    "structlog>=24.4,<25.0",
    "email-validator>=2.2,<3.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0,<10.0",
    "pytest-asyncio>=1.0,<2.0",
    "pytest-cov>=7.0,<8.0",
    "ruff>=0.7,<0.8",
    "mypy>=1.13,<2.0",
    "bandit[toml]>=1.7,<2.0",
    "pip-audit>=2.7,<3.0",
    "pip-licenses>=5.0,<6.0",
    "docker>=7.1,<8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "ARG", # flake8-unused-arguments
    "RUF", # ruff-specific
    "S",   # bandit-lite
    "N",   # pep8-naming
]
ignore = [
    "E501",  # line-too-long — formatter handles
    "S101",  # use-of-assert — fine in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S", "ARG"]
# Domain-exception names follow phase-spec naming (no Error suffix) per ADR-024
# contract conformance — exceptions surface as error codes, not class names.
"**/exceptions.py" = ["N818"]
# FastAPI idiom: Depends() / Header() in argument defaults is the canonical pattern.
"**/routers/**" = ["B008"]
"**/middleware.py" = ["B008"]
"**/deps.py" = ["B008"]
# Protocol implementations + anti-enum stubs intentionally ignore some args
# (NoOpEmailSender drops token/expires_at; resend/forgot ignore user_agent
# since rate-limit is keyed on email only).
"**/email_service.py" = ["ARG002"]
"**/auth_service.py" = ["ARG002"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["dramatiq.*", "argon2.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--strict-markers -ra"
markers = [
    "integration: integration tests requiring docker-compose stack (deselect with '-m \"not integration\"')",
]
# Promote warnings to errors so the suite never silently grows noise.
# Add narrow ignores below if a third-party deprecation can't be avoided.
filterwarnings = [
    "error",
]

[tool.coverage.run]
source = ["src"]
branch = true
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 70
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]

name: ci-frontend

# AC3: timeout-minutes ≤ 8 enforced
# AC2: coverage ≥ 70% via vitest --coverage threshold config
# AC5: license-check step blocks GPL/AGPL/LGPL deps

on:
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/ci-frontend.yml'
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/ci-frontend.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: lint + typecheck + test + audit + license
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps (npm ci)
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: ESLint (max-warnings=0)
        working-directory: frontend
        run: npm run lint

      - name: Prettier — format check
        working-directory: frontend
        run: npm run format:check

      - name: TypeScript strict typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Design-token compliance gates [AC6 / REVIEW-CHECKLIST §A-§B]
        working-directory: frontend
        run: |
          set -e
          fail=0
          # §A1 — no inline hex colours in components (token CSS files are exempt).
          if grep -rnE '(text|bg|border|fill|stroke|from|to|via)-\[#|#[0-9a-fA-F]{3,8}' src --include='*.tsx'; then
            echo "::error::Inline hex colour found in a .tsx file — use a semantic token utility."; fail=1
          fi
          # §A3 — no arbitrary numeric spacing/size values (e.g. p-[14px], w-[200px]).
          if grep -rnE '\b(p|px|py|pt|pb|pl|pr|m|mx|my|mt|mb|ml|mr|gap|w|h|min-w|min-h|max-w|max-h|rounded|text|z)-\[[0-9]' src --include='*.tsx'; then
            echo "::error::Arbitrary numeric Tailwind value found — use a scale token."; fail=1
          fi
          # AC5 — all 18 inventory primitives are exported from the barrel.
          n=$(grep -cE '^export \{' src/components/ui/index.ts || true)
          echo "barrel export lines: $n (expect >= 18 components)"
          test "$n" -ge 18 || { echo "::error::ui barrel exports fewer than 18 components"; fail=1; }
          exit $fail

      - name: Vitest + coverage [AC2 ≥ 70%]
        working-directory: frontend
        run: npm test

      - name: Vite build smoke (catches build-time errors)
        working-directory: frontend
        run: npm run build

      # Scope to runtime deps — what actually ships to users. The dev/build
      # toolchain (vitest@2 → nested vite/esbuild GHSA-67mh-4wv8-2f99) carries
      # advisories that never reach the bundle; bumping it is a Wave-1 tooling
      # pass (would force the vitest 3.x breaking upgrade), tracked separately.
      - name: npm audit (high+ severity, production deps)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

      - name: License check — forbid GPL/AGPL/LGPL [AC5]
        working-directory: frontend
        run: npm run license-check

      - name: Upload coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v4
        with:
          file: frontend/coverage/lcov.info
          flags: frontend
          fail_ci_if_error: false

  e2e:
    name: playwright smoke + a11y (backend-free)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps (npm ci)
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # Runs only the backend-free specs (routes render + axe, FZ-152 consent
      # gate, dark/light toggle). @backend + @live demo are local-only — the
      # full live demo needs the docker stack with real LLM keys.
      - name: Playwright smoke + axe [AC2 routes · AC7 a11y · AC8 theme · AC12 consent]
        working-directory: frontend
        run: npm run e2e:ci

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

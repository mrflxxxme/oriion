name: ci-security

# AC3: timeout-minutes ≤ 8 enforced per job
# AC4: gitleaks job blocks PRs с embedded secrets (e.g. AKIA[0-9A-Z]{16})

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  security-events: write
  pull-requests: read

jobs:
  secrets-scan:
    name: secrets — gitleaks + trufflehog
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks [AC4]
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # On push to main, BASE (default branch) == HEAD → trufflehog-action
      # guard aborts with exit 1. Gitleaks is the canonical secrets gate (AC4)
      # and runs on both push and PR; TruffleHog (--only-verified) is a
      # supplementary diff scan that already runs on the PR before merge.
      # So restrict it to pull_request to keep main green without weakening
      # the canonical gate. See ci-security.yml header (AC4).
      - name: TruffleHog (verified secrets only)
        if: ${{ github.event_name == 'pull_request' }}
        uses: trufflesecurity/trufflehog@v3.84.2
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified

  filesystem-scan:
    name: filesystem — trivy
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Trivy filesystem scan (vulnerabilities + misconfigs + secrets)
        # pinned (was @master) — supply-chain + reproducibility; bump deliberately
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
          # Documented ignore registry (ADR-014). Currently: CVE-2026-48710
          # (starlette — fix only in 1.0.x, unreachable under fastapi <0.130).
          trivyignores: .trivyignore
          format: sarif
          output: trivy-results.sarif

      - name: Upload Trivy SARIF to GitHub Security tab
        if: ${{ !cancelled() }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif

  sbom-and-grype:
    name: SBOM (syft) + vuln scan (grype)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Generate SBOM (Syft)
        id: sbom
        uses: anchore/sbom-action@v0
        with:
          path: ./
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: true
          upload-artifact-retention: 30

      - name: Vulnerability scan (Grype)
        uses: anchore/scan-action@v5
        with:
          sbom: sbom.spdx.json
          severity-cutoff: high
          fail-build: true
          output-format: sarif

      - name: Upload Grype SARIF to GitHub Security tab
        if: ${{ !cancelled() }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif

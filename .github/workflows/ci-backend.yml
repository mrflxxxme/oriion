name: ci-backend

# AC3: timeout-minutes ≤ 8 enforced
# AC2: coverage ≥ 70% via pytest-cov --cov-fail-under
# AC5: license-check step blocks GPL/AGPL/LGPL deps

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'scripts/**'
      - '.planning/contracts/role-prompts/**'
      - '.github/workflows/ci-backend.yml'
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'scripts/**'
      - '.planning/contracts/role-prompts/**'
      - '.github/workflows/ci-backend.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: lint + typecheck + test + security + license
    runs-on: ubuntu-latest
    timeout-minutes: 8

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: oriion
          POSTGRES_PASSWORD: oriion-dev
          POSTGRES_DB: oriion_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oriion -d oriion_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://oriion:oriion-dev@localhost:5432/oriion_test
      TEST_DATABASE_URL: postgresql+asyncpg://oriion:oriion-dev@localhost:5432/oriion_test
      REDIS_URL: redis://localhost:6379/0
      # Generated at job start (see Generate dev BYOK key step). Non-secret —
      # static base64 string of "ci-test-master-key-32-bytes-zzzz".
      CI_BYOK_MASTER_KEY_B64: ""

    steps:
      - uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.5.4"
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Sync dependencies
        working-directory: backend
        # --frozen only: lock drift must fail CI; regenerate uv.lock locally when changing deps
        run: uv sync --frozen

      - name: Role-prompts single-source (AC-W1-20) — drift check
        run: |
          # The packaged copy must NOT be committed — it is build-populated.
          if [ -n "$(git ls-files backend/role_prompts)" ]; then
            echo "::error::backend/role_prompts/ is committed; it must be gitignored + synced from .planning/contracts/role-prompts/ (scripts/sync_role_prompts.sh)"
            exit 1
          fi
          sh scripts/sync_role_prompts.sh
          # The synced copy must match canonical exactly (loader + prod image rely on it).
          diff -rq .planning/contracts/role-prompts backend/role_prompts

      - name: Tools-allowlist → registry conformance (ADR-028 P-AUDIT-3)
        # Every tool slug in a vertical-prompt tools_allowed: block must exist in
        # the canonical .planning/tools/registry.md. Unknown slug => block merge.
        run: python scripts/check_tools_allowlist.py

      - name: Enable pgvector + pg_trgm + unaccent extensions
        env:
          PGPASSWORD: oriion-dev
        run: |
          psql -h localhost -U oriion -d oriion_test -c "CREATE EXTENSION IF NOT EXISTS vector;"
          psql -h localhost -U oriion -d oriion_test -c "CREATE EXTENSION IF NOT EXISTS pg_trgm;"
          psql -h localhost -U oriion -d oriion_test -c "CREATE EXTENSION IF NOT EXISTS unaccent;"

      - name: Generate dev BYOK master key (CI-only)
        # Deterministic non-secret key for CI integration tests. Avoids
        # checking a high-entropy base64 literal into the workflow YAML.
        run: |
          KEY=$(printf 'ci-test-master-key-for-dev-only!' | head -c 32 | base64 -w0)
          echo "CI_BYOK_MASTER_KEY_B64=$KEY" >> "$GITHUB_ENV"

      - name: Pre-create alembic_version with wider column
        env:
          PGPASSWORD: oriion-dev
        # Alembic's default `alembic_version.version_num VARCHAR(32)` truncates
        # long revision IDs (e.g. `multitenancy_0004_provision_cell_schema_function`).
        # Create the table with VARCHAR(255) BEFORE alembic runs — alembic
        # detects an existing table and skips its own CREATE TABLE.
        run: |
          psql -h localhost -U oriion -d oriion_test -c "
            CREATE TABLE IF NOT EXISTS alembic_version (
              version_num VARCHAR(255) NOT NULL
                CONSTRAINT alembic_version_pkc PRIMARY KEY
            );"

      - name: Apply alembic migrations to test DB
        working-directory: backend
        # `heads` (plural) — Alembic has one head per bounded-context branch
        # (_shared, iam, multitenancy, rbac, audit, llm_gateway, billing, mcp);
        # `head` (singular) errors when >1 head exists.
        run: uv run alembic upgrade heads

      - name: Ruff lint + format check
        working-directory: backend
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests

      - name: Mypy strict
        working-directory: backend
        run: uv run mypy --strict src

      - name: Pytest unit suite [AC2 ≥ 70% aggregate]
        working-directory: backend
        env:
          # Dev-only AES-256 master key generated at runtime from a non-secret
          # deterministic seed. Avoids the gitleaks high-entropy-literal false
          # positive that would fire on a checked-in base64 string. Real prod
          # key lives in Yandex Lockbox (Wave 1+).
          BYOK_MASTER_KEY_B64: ${{ env.CI_BYOK_MASTER_KEY_B64 }}
        run: |
          uv run pytest \
            --cov=src \
            --cov-fail-under=70 \
            --cov-report=xml \
            --cov-report=term-missing

      - name: Pytest integration suite (real PG)
        working-directory: backend
        env:
          # Dev-only AES-256 master key generated at runtime from a non-secret
          # deterministic seed. Avoids the gitleaks high-entropy-literal false
          # positive that would fire on a checked-in base64 string. Real prod
          # key lives in Yandex Lockbox (Wave 1+).
          BYOK_MASTER_KEY_B64: ${{ env.CI_BYOK_MASTER_KEY_B64 }}
        run: |
          uv run pytest -m "integration and not live"

      - name: Per-module coverage gate (Phase 00.2.5 — uniform ≥85%)
        working-directory: backend
        env:
          # Dev-only AES-256 master key generated at runtime from a non-secret
          # deterministic seed. Avoids the gitleaks high-entropy-literal false
          # positive that would fire on a checked-in base64 string. Real prod
          # key lives in Yandex Lockbox (Wave 1+).
          BYOK_MASTER_KEY_B64: ${{ env.CI_BYOK_MASTER_KEY_B64 }}
        run: |
          uv run pytest tests/iam          --cov=src/iam          --cov-fail-under=85 -q -m "not integration"
          uv run pytest tests/multitenancy --cov=src/multitenancy --cov-fail-under=85 -q -m "not integration"
          uv run pytest tests/rbac         --cov=src/rbac         --cov-fail-under=85 -q -m "not integration"
          uv run pytest tests/audit        --cov=src/audit        --cov-fail-under=85 -q -m "not integration"
          uv run pytest tests/llm_gateway  --cov=src/llm_gateway  --cov-fail-under=85 -q -m "not integration"
          uv run pytest tests/mcp          --cov=src/mcp          --cov-fail-under=85 -q -m "not integration"
          # Phase 00.5b Commit 3: extend the per-module loop with the
          # bounded-contexts that gained surface during Phase 00.5a/00.5b.
          # billing — dedicated tests/billing subtree (Phase 01.3). Billing is a
          #   DB/RLS-bound context: its correctness (RLS isolation, ledger SUM,
          #   per-cell/per-day caps, idempotent trial grant, the register→trial
          #   hook, BYOK skip-debit) is proven by real-PG integration, so the
          #   gate runs the full subtree (unit + integration, exclude live).
          uv run pytest tests/billing      --cov=src/billing      --cov-fail-under=85 -q -m "not live"
          # Phase 00.6 Commit 12 (AC13 strict honor): tests/tasks/ +
          # tests/runtime/ unit tests landed Commits 10-11 (95.82% src/tasks +
          # 94.92% src/runtime). F-TR-M1/M2 audit closure: test_cancel_cascade.py
          # relocated tests/agents/ → tests/tasks/.
          uv run pytest tests/tasks       --cov=src/tasks        --cov-fail-under=85 -q -m "not integration"
          uv run pytest tests/runtime     --cov=src/runtime      --cov-fail-under=85 -q -m "not integration"
          # AC-W1-17: src/agents now has dedicated unit tests (factories, routers,
          # schemas, models, events, seed_data, archetype + team_provisioning
          # services) — the per-module ≥85 gate now matches every other context
          # (local measure ~98%). The Wave-0 40 ratchet floor is retired.
          uv run pytest tests/agents --cov=src/agents --cov-fail-under=85 -q -m "not integration"
          # Phase 01.6 (ADR-039): src/security is a deterministic guardrails
          # context (RU-PDN DLP + injection + capability) — pure unit, no DB.
          uv run pytest tests/security    --cov=src/security     --cov-fail-under=85 -q -m "not integration"
          # _shared/db + _shared/middleware gates: deferred. set_tenant_
          # context is exercised through test_e2e_auth_flow.py integration
          # (oriion_app role canary) + Phase 00.6 Commit 3 refactor moved
          # auth_service.register к use the canonical async-cm helper, so
          # unit-test coverage flows from tests/iam/unit/test_auth_service.
          # py. A dedicated tests/_shared/ subtree gate is Wave-1 hygiene
          # (paired с C13 observability tests когда the surface grows).
          # observability/ unit-test gate: paired с C13 (test_metrics.py).

      # Per-phase coverage gate: Phase 00.2 AC9 demands ≥85% on src/iam
      # specifically. Without this, the global 70% gate hides regressions
      # in the iam bounded context once other contexts (multitenancy,
      # audit, llm_gateway, …) start adding less-covered code.
      - name: Pytest iam-specific coverage [Phase 00.2 AC9 ≥ 85%]
        working-directory: backend
        run: |
          uv run pytest tests/iam \
            --cov=src.iam \
            --cov-fail-under=85 \
            --cov-report=term-missing \
            -m "not integration"

      - name: Bandit (security linter)
        working-directory: backend
        run: uv run bandit -r src -c pyproject.toml

      - name: pip-audit (CVE scan)
        working-directory: backend
        # --skip-editable: skip local project (teamly-backend) — not on PyPI.
        # --strict NOT used: treats skip-editable как error. Default exit
        # behavior still fails CI если найдены CVE в audited packages.
        #
        # Ignored vulnerabilities (each requires a documented rationale):
        # * PYSEC-2025-183 (pyjwt, CVE-2025-45768) — DISPUTED by upstream
        #   maintainer (jpadilla). Claim: "weak encryption" if key length
        #   chosen by application is short. Our usage: HS256 with mandatory
        #   32+ char secret per ADR-014 + Settings.jwt_secret_access_v1
        #   default carries the "min-32-chars" requirement literally. No
        #   fix version published; advisory has no upper-bound (all versions
        #   marked affected). Re-review at every pyjwt bump.
        # * CVE-2025-69872 (diskcache) — transitive dep via pydantic-ai/fastmcp.
        #   No fix version published as of 2026-05-21. Not on a runtime
        #   critical path for our stack (used internally by fastmcp for
        #   its own caching, not our user-data). Re-review when diskcache
        #   publishes a fix or when fastmcp drops the dep.
        # * PYSEC-2026-196 (pip 26.1.1, fix 26.1.2) — pip is a BUILD-TIME tool,
        #   not shipped in the runtime image (prod Dockerfile installs locked
        #   deps via uv with hashes, never `pip install` from untrusted indexes).
        #   pip 26.1.2 is not yet what uv bundles. CVE drift (2026-06).
        #   Re-review when the uv-bundled pip reaches 26.1.2.
        # * CVE-2026-48817 / CVE-2026-48818 / CVE-2026-54282 / CVE-2026-54283
        #   (starlette 0.52.1; fixes only in 1.1.0/1.3.0/1.3.1) — UNREACHABLE:
        #   transitive via fastapi (pinned >=0.120,<0.130 → starlette 0.x); the
        #   1.x fixes need a fastapi major bump. CVE drift (2026-06). Re-review at
        #   the Wave-1 fastapi+starlette bump (mirrors .trivyignore). The aiohttp /
        #   cryptography / python-multipart drift in the same scan was FIXED by
        #   bumping (backend/pyproject.toml), so it is not ignored.
        run: uv run pip-audit --skip-editable --ignore-vuln PYSEC-2025-183 --ignore-vuln CVE-2025-69872 --ignore-vuln PYSEC-2026-161 --ignore-vuln PYSEC-2026-196 --ignore-vuln CVE-2026-48817 --ignore-vuln CVE-2026-48818 --ignore-vuln CVE-2026-54282 --ignore-vuln CVE-2026-54283

      - name: License check — forbid GPL/AGPL/LGPL [AC5]
        working-directory: backend
        run: |
          uv run pip-licenses \
            --fail-on="GPL-2.0;GPL-3.0;AGPL-1.0;AGPL-3.0;LGPL-2.0;LGPL-2.1;LGPL-3.0" \
            --format=markdown \
            --with-license-file \
            --no-license-path

      - name: Upload coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v4
        with:
          file: backend/coverage.xml
          flags: backend
          fail_ci_if_error: false

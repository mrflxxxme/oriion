name: ci-backend

# AC3: timeout-minutes ≤ 8 enforced
# AC2: coverage ≥ 70% via pytest-cov --cov-fail-under
# AC5: license-check step blocks GPL/AGPL/LGPL deps

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'scripts/**'
      - '.github/workflows/ci-backend.yml'
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'scripts/**'
      - '.github/workflows/ci-backend.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: lint + typecheck + test + security + license
    runs-on: ubuntu-latest
    timeout-minutes: 8

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: oriion
          POSTGRES_PASSWORD: oriion-dev
          POSTGRES_DB: oriion_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oriion -d oriion_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://oriion:oriion-dev@localhost:5432/oriion_test
      TEST_DATABASE_URL: postgresql+asyncpg://oriion:oriion-dev@localhost:5432/oriion_test
      REDIS_URL: redis://localhost:6379/0
      # Generated at job start (see Generate dev BYOK key step). Non-secret —
      # static base64 string of "ci-test-master-key-32-bytes-zzzz".
      CI_BYOK_MASTER_KEY_B64: ""

    steps:
      - uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.4"
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Sync dependencies
        working-directory: backend
        run: uv sync --frozen 2>/dev/null || uv sync

      - name: Enable pgvector + pg_trgm + unaccent extensions
        env:
          PGPASSWORD: oriion-dev
        run: |
          psql -h localhost -U oriion -d oriion_test -c "CREATE EXTENSION IF NOT EXISTS vector;"
          psql -h localhost -U oriion -d oriion_test -c "CREATE EXTENSION IF NOT EXISTS pg_trgm;"
          psql -h localhost -U oriion -d oriion_test -c "CREATE EXTENSION IF NOT EXISTS unaccent;"

      - name: Generate dev BYOK master key (CI-only)
        # Deterministic non-secret key for CI integration tests. Avoids
        # checking a high-entropy base64 literal into the workflow YAML.
        run: |
          KEY=$(printf 'ci-test-master-key-for-dev-only!' | head -c 32 | base64 -w0)
          echo "CI_BYOK_MASTER_KEY_B64=$KEY" >> "$GITHUB_ENV"

      - name: Pre-create alembic_version with wider column
        env:
          PGPASSWORD: oriion-dev
        # Alembic's default `alembic_version.version_num VARCHAR(32)` truncates
        # long revision IDs (e.g. `multitenancy_0004_provision_cell_schema_function`).
        # Create the table with VARCHAR(255) BEFORE alembic runs — alembic
        # detects an existing table and skips its own CREATE TABLE.
        run: |
          psql -h localhost -U oriion -d oriion_test -c "
            CREATE TABLE IF NOT EXISTS alembic_version (
              version_num VARCHAR(255) NOT NULL
                CONSTRAINT alembic_version_pkc PRIMARY KEY
            );"

      - name: Apply alembic migrations to test DB
        working-directory: backend
        # `heads` (plural) — Alembic has one head per bounded-context branch
        # (_shared, iam, multitenancy, rbac, audit, llm_gateway, billing, mcp);
        # `head` (singular) errors when >1 head exists.
        run: uv run alembic upgrade heads

      - name: Ruff lint + format check
        working-directory: backend
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests

      - name: Mypy strict
        working-directory: backend
        run: uv run mypy --strict src

      - name: Pytest unit suite [AC2 ≥ 70% aggregate]
        working-directory: backend
        env:
          # Dev-only AES-256 master key generated at runtime from a non-secret
          # deterministic seed. Avoids the gitleaks high-entropy-literal false
          # positive that would fire on a checked-in base64 string. Real prod
          # key lives in Yandex Lockbox (Wave 1+).
          BYOK_MASTER_KEY_B64: ${{ env.CI_BYOK_MASTER_KEY_B64 }}
        run: |
          uv run pytest \
            --cov=src \
            --cov-fail-under=70 \
            --cov-report=xml \
            --cov-report=term-missing

      - name: Pytest integration suite (real PG)
        working-directory: backend
        env:
          # Dev-only AES-256 master key generated at runtime from a non-secret
          # deterministic seed. Avoids the gitleaks high-entropy-literal false
          # positive that would fire on a checked-in base64 string. Real prod
          # key lives in Yandex Lockbox (Wave 1+).
          BYOK_MASTER_KEY_B64: ${{ env.CI_BYOK_MASTER_KEY_B64 }}
        run: |
          uv run pytest -m "integration and not live"

      - name: Per-module coverage gate (Phase 00.2.5 — uniform ≥85%)
        working-directory: backend
        env:
          # Dev-only AES-256 master key generated at runtime from a non-secret
          # deterministic seed. Avoids the gitleaks high-entropy-literal false
          # positive that would fire on a checked-in base64 string. Real prod
          # key lives in Yandex Lockbox (Wave 1+).
          BYOK_MASTER_KEY_B64: ${{ env.CI_BYOK_MASTER_KEY_B64 }}
        run: |
          uv run pytest tests/iam          --cov=src/iam          --cov-fail-under=85 -q -m "not integration"
          uv run pytest tests/multitenancy --cov=src/multitenancy --cov-fail-under=85 -q -m "not integration"
          uv run pytest tests/rbac         --cov=src/rbac         --cov-fail-under=85 -q -m "not integration"
          uv run pytest tests/audit        --cov=src/audit        --cov-fail-under=85 -q -m "not integration"
          uv run pytest tests/llm_gateway  --cov=src/llm_gateway  --cov-fail-under=85 -q -m "not integration"
          uv run pytest tests/mcp          --cov=src/mcp          --cov-fail-under=85 -q -m "not integration"
          # Phase 00.5b Commit 3: extend the per-module loop with the
          # bounded-contexts that gained surface during Phase 00.5a/00.5b.
          # billing — covered by tests/llm_gateway (no tests/billing
          #   subtree; src/billing/models.py is exercised through the
          #   llm_gateway.services.billing_service tests, which is the
          #   sanctioned cross-context model import per ADR-024 §3
          #   amendment landing in Phase 00.5b Commit 8).
          uv run pytest tests/llm_gateway  --cov=src/billing      --cov-fail-under=85 -q -m "not integration"
          # _shared/db + _shared/middleware gates: deferred to Phase 00.5b
          # Commits 5-6. Unit-test additions for set_tenant_context +
          # get_tenant_db_session land alongside the agents/tasks/runtime
          # contexts that consume them. Integration coverage from
          # test_e2e_auth_flow.py already exercises both modules under
          # `oriion_app` role (Phase 00.5a canary).
          # agents/tasks/runtime gates: deferred to their landing commits
          # (Phase 00.5b Commits 5-6) — the modules don't exist yet at
          # this revision so adding gates now would error.

      # Per-phase coverage gate: Phase 00.2 AC9 demands ≥85% on src/iam
      # specifically. Without this, the global 70% gate hides regressions
      # in the iam bounded context once other contexts (multitenancy,
      # audit, llm_gateway, …) start adding less-covered code.
      - name: Pytest iam-specific coverage [Phase 00.2 AC9 ≥ 85%]
        working-directory: backend
        run: |
          uv run pytest tests/iam \
            --cov=src.iam \
            --cov-fail-under=85 \
            --cov-report=term-missing \
            -m "not integration"

      - name: Bandit (security linter)
        working-directory: backend
        run: uv run bandit -r src -c pyproject.toml

      - name: pip-audit (CVE scan)
        working-directory: backend
        # --skip-editable: skip local project (teamly-backend) — not on PyPI.
        # --strict NOT used: treats skip-editable как error. Default exit
        # behavior still fails CI если найдены CVE в audited packages.
        #
        # Ignored vulnerabilities (each requires a documented rationale):
        # * PYSEC-2025-183 (pyjwt, CVE-2025-45768) — DISPUTED by upstream
        #   maintainer (jpadilla). Claim: "weak encryption" if key length
        #   chosen by application is short. Our usage: HS256 with mandatory
        #   32+ char secret per ADR-014 + Settings.jwt_secret_access_v1
        #   default carries the "min-32-chars" requirement literally. No
        #   fix version published; advisory has no upper-bound (all versions
        #   marked affected). Re-review at every pyjwt bump.
        run: uv run pip-audit --skip-editable --ignore-vuln PYSEC-2025-183

      - name: License check — forbid GPL/AGPL/LGPL [AC5]
        working-directory: backend
        run: |
          uv run pip-licenses \
            --fail-on="GPL-2.0;GPL-3.0;AGPL-1.0;AGPL-3.0;LGPL-2.0;LGPL-2.1;LGPL-3.0" \
            --format=markdown \
            --with-license-file \
            --no-license-path

      - name: Upload coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v4
        with:
          file: backend/coverage.xml
          flags: backend
          fail_ci_if_error: false

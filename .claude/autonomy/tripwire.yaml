# Autonomy tripwire — задняя растяжка per ADR-037 D2.
#
# Runner (Claude в автономной сессии) перед auto-merge классифицирует diff PR'а
# по этим path-глобам. Совпадение с любой категорией → НЕ auto-merge:
# фаза доводится до зелёного, пишется в RUN-QUEUE.md + push-notify, ждёт founder 1-клик /ack.
# Ничего не совпало + все гейты зелёные → auto-merge.
#
# Классификатор — git diff --name-only origin/main...HEAD, сверка через fnmatch.
# Источник истины для категорий — ADR-037 §Decision D2. Меняешь список — правь ADR.
#
# Консервативная позиция v1: под-нюанс «существующие таблицы vs новая таблица»
# для миграций runner ОБЯЗАН применять сам (см. runner_nuance), но по умолчанию
# ЛЮБАЯ миграция = ack. Ослабляй только после накопленного доверия.

version: 1
policy: pause-and-ack        # matched → prepare + green + wait for founder /ack
default_when_unmatched: auto-merge

categories:
  db_migrations:
    reason: "Миграция БД — риск по существующим таблицам / RLS-политикам (D2)"
    globs:
      - "backend/migrations/versions/**"
    runner_nuance: |
      Ack ОБЯЗАТЕЛЕН, если миграция: ALTER/DROP существующей таблицы/колонки,
      изменение RLS-политики, backfill/data-migration, изменение индексов на
      горячих таблицах.
      v2 (grill 2026-07-03, option C): classify_tripwire.py делает КОНТЕНТНУЮ
      проверку upgrade() и АВТО-СНИМАЕТ db_migrations, если КАЖДАЯ затронутая
      миграция — доказуемо чистый greenfield CREATE (новые таблицы/схемы + их RLS
      с нуля). Fail-closed: любой f-string, ALTER/DROP/backfill, index на не-этой
      таблице, неизвестный вызов, или нечитаемый файл → ack сохраняется. Чтобы
      pure-CREATE миграция авто-мёржилась, RLS/триггер-boilerplate писать через
      literal-хелперы `backend/migrations/_rls.py` (cell_scoped_rls /
      updated_at_trigger), а НЕ через f-string-цикл (последний неинспектируем →
      всегда ack). Вердикт контент-проверки — в поле verdict `db_migrations_content_check`.

  auth_rbac_sessions:
    reason: "Auth / RBAC / сессии — surface аутентификации и авторизации (D2)"
    globs:
      - "backend/src/iam/**"
      - "backend/src/rbac/**"
      - "backend/migrations/versions/iam/**"
      - "backend/migrations/versions/rbac/**"

  billing_money:
    reason: "Billing / денежные пути — кредиты, каппы, ЮKassa (D2)"
    globs:
      - "backend/src/billing/**"
      - "backend/migrations/versions/billing/**"

  secrets_keys_crypto:
    reason: "Секреты / ключи / шифрование — BYOK, master-key, env (D2)"
    globs:
      - "backend/src/llm_gateway/**"
      - "**/*secret*"
      - "**/*crypto*"
      - "**/byok*"
      - "**/.env*"
      - ".claude/agents/_shared/cost-budget.yaml"

  public_api_contracts:
    reason: "Слом публичных API/data-контрактов bounded-context (D2)"
    globs:
      - ".planning/contracts/**"
    runner_nuance: |
      ADR-040 D2: охраняемый публичный контракт = генерируемый
      `.planning/contracts/openapi.snapshot.json` (экспорт живой FastAPI-схемы).
      Реализован в Phase 01.8c: `scripts/autonomy/export_openapi.py --check` в
      ci-backend валит PR при дрейфе снапшота относительно кода (breaking-diff =
      red + этот tripwire-сигнал). Рукописные contracts/<ctx>/api.yaml понижены до
      design-time черновиков (несут заголовок «NON-NORMATIVE»; расхождение с живым
      API — НЕ нарушение); contracts/<ctx>/schema.sql остаются нормативными
      (проверяются миграциями). Глоб `.planning/contracts/**` намеренно широкий и
      охватывает snapshot, schema.sql И черновики: правка любого из них = ack
      (fail-safe/консервативно — сужаем только по накоплении доверия, см. шапку файла).

# Notes:
# - Секции src/multitenancy, src/memory, src/tasks, src/agents, src/mcp, src/audit
#   НЕ в растяжке — обычная внутренняя логика, auto-merge при зелёных гейтах.
#   Их МИГРАЦИИ попадают под db_migrations выше (любая versions/** = ack v1).
# - Frontend (frontend/**) целиком вне растяжки на Wave 1 (нет денег/секретов/auth
#   на клиенте — auth-токены плечо в iam). Пересмотреть при появлении client-side crypto.

# infra/docker-compose.dev.yml — dev stack (cold-start ≤ 600s target per AC1)
#
# Запуск из repo root:
#   docker compose -f infra/docker-compose.dev.yml up -d
#
# Все service paths relative к этому compose file:
#   build: ../backend → repo_root/backend
#   volumes: "../frontend:/app" → repo_root/frontend
#
# Healthchecks: AC6 требует все services healthy в течение 180s после `compose up`.

name: teamly-dev

services:
  postgres:
    # pgvector/pgvector:pg16 — official Postgres 16 + pgvector extension preinstalled.
    # plain postgres:16-alpine НЕ содержит pgvector → init script упадёт.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: oriion
      POSTGRES_PASSWORD: oriion-dev
      POSTGRES_DB: oriion_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init-pgvector.sh:/docker-entrypoint-initdb.d/01-init-pgvector.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oriion -d oriion_dev"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: oriion
      MINIO_ROOT_PASSWORD: oriion-dev-s3
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://oriion:oriion-dev@postgres:5432/oriion_dev
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: oriion
      MINIO_SECRET_KEY: oriion-dev-s3
      PYTHONUNBUFFERED: "1"
      # AC-W1-1: Redis-Streams SSE so /stream sees events produced by the
      # out-of-process Dramatiq worker (AC-W1-16a). MUST match the worker.
      SSE_BACKEND: redis
      # AC-W1-20: read role-prompts from the canonical mount below (the loader's
      # in-container parents-walk can't reach .planning under ../backend:/app).
      ROLE_PROMPTS_DIR: /app/role_prompts
    ports:
      - "8000:8000"
    volumes:
      - ../backend:/app
      - backend_venv:/app/.venv
      # Canonical role-prompts, read-only — single source, no committed copy.
      - ../.planning/contracts/role-prompts:/app/role_prompts:ro
    command:
      - sh
      - -c
      - "uv sync --frozen 2>/dev/null || uv sync; uv run uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload"
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\", timeout=2)' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 60s

  # AC-W1-16a: Dramatiq worker that runs task orchestrations off-request. POST
  # /run enqueues here and returns 202 <1s; the worker streams its SSE ledger via
  # Redis (SSE_BACKEND=redis) so the backend's /stream sees it. -p1 -t1 keeps the
  # workers=1 / single-global-budget invariant (F-ARC-H2). Depends on backend
  # healthy so the shared venv is already synced (fast no-op sync here).
  worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://oriion:oriion-dev@postgres:5432/oriion_dev
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: oriion
      MINIO_SECRET_KEY: oriion-dev-s3
      PYTHONUNBUFFERED: "1"
      SSE_BACKEND: redis
      ROLE_PROMPTS_DIR: /app/role_prompts
    volumes:
      - ../backend:/app
      - backend_venv:/app/.venv
      - ../.planning/contracts/role-prompts:/app/role_prompts:ro
    command:
      - sh
      - -c
      - "uv sync --frozen 2>/dev/null || uv sync; uv run dramatiq src.runtime.queue.worker --processes 1 --threads 1"

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      target: dev
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    volumes:
      - ../frontend:/app
      - frontend_node_modules:/app/node_modules
    command: sh -c "npm ci --no-audit --no-fund && npm run dev -- --host 0.0.0.0 --port 5173"
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:5173/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 60s

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile.dev:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  postgres_data: {}
  redis_data: {}
  minio_data: {}
  caddy_data: {}
  caddy_config: {}
  backend_venv: {}
  frontend_node_modules: {}

# AC-W1-14 / AC-W1-15 live proof harness — NOT a deploy stack.
#
# Stands up the obs/IaC residual end-to-end on local containers so the
# acceptance can be DEMONSTRATED (not just config-validated):
#   * minio          — S3-compatible bucket (stands in for Yandex Object Storage)
#   * loki           — runs the REAL infra/observability/loki.yaml (S3 + 90d +
#                      compactor) pointed at minio; chunks land in the bucket
#   * alertmanager   — proof routing config (webhook -> sink) that mirrors the
#                      real route tree (default + severity=critical); proves
#                      fire -> route -> deliver without real Telegram/PagerDuty
#   * sink           — webhook receiver that echoes delivered alerts to stdout
#
# Driven by ./run-proof.sh. Tear down with `docker compose -f
# docker-compose.proof.yml -p obsproof down -v`.

services:
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data
    environment:
      MINIO_ROOT_USER: proofkey
      MINIO_ROOT_PASSWORD: proofsecret123
    ports:
      - "19000:9000"  # host access for the audit-archival upload proof
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 3s
      retries: 20

  mc-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set m http://minio:9000 proofkey proofsecret123 &&
        mc mb -p m/loki-archive &&
        echo "bucket loki-archive ready"

  loki:
    image: grafana/loki:3.2.0
    depends_on:
      mc-init:
        condition: service_completed_successfully
    volumes:
      - ../loki.yaml:/etc/loki/loki.yaml:ro
    command: ["-config.file=/etc/loki/loki.yaml", "-config.expand-env=true"]
    environment:
      LOKI_S3_ENDPOINT: minio:9000
      LOKI_S3_REGION: us-east-1
      LOKI_S3_BUCKET: loki-archive
      LOKI_S3_ACCESS_KEY_ID: proofkey
      LOKI_S3_SECRET_ACCESS_KEY: proofsecret123
      LOKI_S3_INSECURE: "true"
    ports:
      - "13100:3100"

  sink:
    image: mendhak/http-https-echo:31
    environment:
      HTTP_PORT: "8080"

  alertmanager:
    image: prom/alertmanager:v0.27.0
    depends_on:
      - sink
    volumes:
      - ./alertmanager.proof.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    ports:
      - "19093:9093"

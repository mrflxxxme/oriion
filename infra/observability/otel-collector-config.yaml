# OpenTelemetry Collector config — Phase 00.6 Stage A staging stack.
#
# Receives OTLP gRPC + HTTP from backend, fans out:
#   * traces → tempo (via OTLP exporter)
#   * metrics → prometheus (via Prometheus exporter scraped at :8889)
#
# Self-metrics exposed at :8888 by default (collector built-in
# `service.telemetry.metrics.address` — no explicit reader config needed,
# which would race the built-in on the same port).

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 1s
    send_batch_size: 1024
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  prometheus:
    endpoint: 0.0.0.0:8889
    namespace: oriion
  debug:
    verbosity: basic

service:
  # Default collector self-metrics exposed at :8888 — Prometheus scrapes it
  # via the `otel-collector` job в infra/observability/prometheus.yml.
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/tempo]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus]

# Loki config — Phase 01.1 infra-PR (AC-W1-14).
#
# Wave-0 kept 7d retention on local filesystem. AC-W1-14 raises retention to 90d
# and ships index + chunks to the RU-zone Yandex Object Storage bucket
# `oriion-staging-loki-archive` (provisioned in infra/terraform/object_storage.tf),
# so the log ledger stays in РФ (ФЗ-152) and survives VM-disk loss.
#
# S3 credentials are env-expanded (the loki command adds `-config.expand-env=true`):
#   LOKI_S3_ACCESS_KEY_ID / LOKI_S3_SECRET_ACCESS_KEY — the storage SA static key
#   (object_storage.tf yandex_iam_service_account_static_access_key.storage),
#   materialized by the deploy from YC Lockbox. Yandex Object Storage is
#   S3-compatible (endpoint storage.yandexcloud.net, path-style addressing).
#
# Loki tails container stdout (structlog JSON, LOG_FORMAT=json) via the Docker
# logging driver / Promtail-equivalent stream (compose.staging-local override C8).

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: info

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    s3:
      endpoint: storage.yandexcloud.net
      region: ru-central1
      bucketnames: oriion-staging-loki-archive
      access_key_id: ${LOKI_S3_ACCESS_KEY_ID}
      secret_access_key: ${LOKI_S3_SECRET_ACCESS_KEY}
      s3forcepathstyle: true
      insecure: false
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 100

schema_config:
  configs:
    - from: 2025-01-01
      store: tsdb
      object_store: s3
      schema: v13
      index:
        prefix: index_
        period: 24h

# Compactor enforces the 90d retention against the S3 store: it rewrites index
# files dropping out-of-retention streams and issues delete requests for the
# expired chunks. retention_enabled MUST be set or retention_period is ignored.
compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  retention_delete_delay: 2h
  delete_request_store: s3

ruler:
  alertmanager_url: http://alertmanager:9093

limits_config:
  allow_structured_metadata: true
  # 90 days = 2160h (AC-W1-14). The compactor deletes chunks past this window
  # from the S3 bucket; the bucket's own 90d lifecycle_rule (object_storage.tf)
  # is the belt-and-braces backstop.
  retention_period: 2160h
  reject_old_samples: true
  reject_old_samples_max_age: 2160h

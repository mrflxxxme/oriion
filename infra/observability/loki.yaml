# Loki config — AC-W1-14: 90d retention + S3 chunk archival to RU Object Storage.
#
# Wave-0 ran single-binary with filesystem chunks + 7d retention. AC-W1-14 raises
# retention to 90d (ФЗ-152 audit window) and ships index + chunks to the RU-zone
# S3 bucket `oriion-staging-loki-archive` (provisioned in Phase 00.6 PR-B
# `infra/terraform/object_storage.tf`). A compactor enforces the 90d retention and
# issues delete requests against the same store.
#
# Credentials are injected from the environment — Loki is started with
# `-config.expand-env=true` so every ${VAR} below is substituted at boot:
#   LOKI_S3_ENDPOINT          storage.yandexcloud.net  (prod) | minio:9000 (proof)
#   LOKI_S3_REGION            ru-central1
#   LOKI_S3_BUCKET            oriion-staging-loki-archive
#   LOKI_S3_ACCESS_KEY_ID     YC static access key (yandex_iam_service_account_static_access_key)
#   LOKI_S3_SECRET_ACCESS_KEY YC static secret key
#   LOKI_S3_INSECURE          false (prod, HTTPS) | true (local MinIO over HTTP)
# On staging these come from YC Lockbox (no on-disk secret — AC-W1-9). The local
# chunk-landing proof (infra/observability/proof/) sets them to a MinIO container.

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: info

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    s3:
      endpoint: ${LOKI_S3_ENDPOINT}
      region: ${LOKI_S3_REGION}
      bucketnames: ${LOKI_S3_BUCKET}
      access_key_id: ${LOKI_S3_ACCESS_KEY_ID}
      secret_access_key: ${LOKI_S3_SECRET_ACCESS_KEY}
      s3forcepathstyle: true
      insecure: ${LOKI_S3_INSECURE}
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 100

schema_config:
  configs:
    - from: 2025-01-01
      store: tsdb
      object_store: s3
      schema: v13
      index:
        prefix: index_
        period: 24h

storage_config:
  tsdb_shipper:
    active_index_directory: /loki/tsdb-index
    cache_location: /loki/tsdb-cache

# Compactor enforces the 90d retention and ships delete requests to the S3 store
# (filesystem-only Wave-0 had no compactor, so retention was never actually
# applied). retention_delete_delay gives a 2h grace before a chunk is purged.
compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: s3
  compaction_interval: 10m
  retention_delete_delay: 2h

ruler:
  alertmanager_url: http://alertmanager:9093

limits_config:
  # metric_aggregation_enabled landed в Loki 3.3+; Phase 00.6 ships Loki
  # 3.2.0 без этого поля. Wave-1 bump к 3.3+ re-enables.
  allow_structured_metadata: true
  retention_period: 2160h  # 90d (AC-W1-14) — backed by the S3 chunk store.
  reject_old_samples: true
  reject_old_samples_max_age: 2160h

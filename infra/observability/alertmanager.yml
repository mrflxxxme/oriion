# Alertmanager config — AC-W1-15: real Telegram + PagerDuty receivers.
#
# The Wave-0 log-only mock receiver is retired. Routing:
#   * severity=critical (e.g. R-04 cost runaway) -> PagerDuty page + Telegram.
#   * everything else (warnings, info)            -> Telegram only.
#
# Secrets are injected from the environment — Alertmanager is started with
# `--config.expand-env=true` so each ${VAR} below is substituted at boot:
#   TELEGRAM_BOT_TOKEN     BotFather token for the on-call bot
#   TELEGRAM_CHAT_ID       numeric chat/channel id (int64 — must NOT be quoted)
#   PAGERDUTY_ROUTING_KEY  PagerDuty Events API v2 integration (routing) key
# On staging these come from YC Lockbox (no on-disk secret — AC-W1-9). The local
# routing proof (infra/observability/proof/) swaps the receivers for a webhook
# sink so the fire->route->deliver pipeline is verified without real tokens; the
# real-endpoint hop is the founder's deploy-time token swap.

global:
  resolve_timeout: 5m
  pagerduty_url: https://events.pagerduty.com/v2/enqueue

route:
  group_by: ["alertname", "severity", "service"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h
  receiver: telegram-default
  routes:
    # Critical alerts page on-call AND post to Telegram.
    - matchers:
        - severity = critical
      receiver: pager-and-telegram

receivers:
  - name: telegram-default
    telegram_configs:
      - bot_token: ${TELEGRAM_BOT_TOKEN}
        chat_id: ${TELEGRAM_CHAT_ID}
        parse_mode: HTML
        send_resolved: true
        message: |
          <b>{{ .Status | toUpper }}</b> · {{ .CommonLabels.alertname }} ({{ .CommonLabels.severity }})
          {{ range .Alerts }}{{ .Annotations.summary }}
          {{ end }}

  - name: pager-and-telegram
    pagerduty_configs:
      - routing_key: ${PAGERDUTY_ROUTING_KEY}
        severity: critical
        description: "{{ .CommonLabels.alertname }} — {{ .CommonLabels.service }}"
        send_resolved: true
    telegram_configs:
      - bot_token: ${TELEGRAM_BOT_TOKEN}
        chat_id: ${TELEGRAM_CHAT_ID}
        parse_mode: HTML
        send_resolved: true
        message: |
          🔴 <b>CRITICAL · {{ .CommonLabels.alertname }}</b>
          {{ range .Alerts }}{{ .Annotations.summary }}
          {{ end }}

inhibit_rules:
  - source_matchers:
      - severity = critical
    target_matchers:
      - severity = warning
    equal: ["alertname", "service"]

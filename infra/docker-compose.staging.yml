# infra/docker-compose.staging.yml — canonical staging stack (Phase 00.6 PR-A)
#
# 9 services: backend + frontend + caddy + otel-collector + prometheus +
# grafana + loki + tempo + (optional) alertmanager.
#
# Managed services NOT in this compose (per ADR-009 HA/auto-backup):
#   * Postgres 16 — Yandex Managed PostgreSQL (DATABASE_URL env)
#   * Redis 7 — Yandex Managed Redis (REDIS_URL env)
#
# For LOCAL founder validation, layer on infra/docker-compose.staging-local.
# override.yml which adds inline postgres + redis services and toggles
# Caddy к HTTP-only mode. See docs/runbooks/local-smoke.md.
#
# Secrets (AC-W1-9): staging/prod read them DIRECTLY from Yandex Lockbox at
# startup (the deploy sets only LOCKBOX_SECRET_ID — nothing materialized to disk).
# Local founder validation has no Lockbox, so docker-compose.staging-local.
# override.yml injects the per-key secrets from backend/.env (gitignored). See
# the local-smoke + staging-bootstrap runbooks for the env-var checklist.

services:
  backend:
    image: ${YC_CR_REGISTRY:-oriion-staging}/oriion-backend:${IMAGE_TAG:-latest}
    build:
      context: ../backend
      target: prod
    restart: always
    # Container hardening (ADR-014-security): block privilege escalation and drop
    # all Linux capabilities — the web tier binds :8000 (>1024) so needs none.
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    environment:
      # AC-W1-9: ALL secrets are read DIRECTLY from YC Lockbox at startup
      # (backend/src/_shared/lockbox.py via the instance SA IAM token) — they are
      # intentionally NOT passed as env here, so nothing is materialized to the VM
      # disk. The deploy only sets LOCKBOX_SECRET_ID; the backend pulls
      # DATABASE_URL / REDIS_URL / DEEPSEEK_API_KEY / YANDEX_* / GIGACHAT_AUTH_KEY /
      # JWT_SECRET_ACCESS_V1 / BRAVE|YANDEX_SEARCH_API_KEY / BYOK_MASTER_KEY_B64
      # from the Lockbox payload. A missing/dev-default secret fails fast in
      # staging/prod (Settings._guard_no_dev_secrets) → a failed deploy, never an
      # insecure boot. Rotate = bump the Lockbox version + SIGHUP (no redeploy) or
      # rolling-restart. Local founder validation injects these from .env via
      # docker-compose.staging-local.override.yml (APP_ENV=dev, guard off).
      LOCKBOX_SECRET_ID: ${LOCKBOX_SECRET_ID:-}
      LOCKBOX_ENDPOINT: ${LOCKBOX_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: oriion-backend
      OTEL_TRACES_ENABLED: "true"
      LOG_FORMAT: json
      LOG_LEVEL: INFO
      APP_ENV: staging
      # AC-W1-1: Redis-Streams SSE so /stream sees events from the out-of-process
      # Dramatiq worker; also lifts the workers=1 SSE constraint (F-ARC-H2).
      SSE_BACKEND: redis
    # SSE is now Redis-backed (AC-W1-1), so the web tier could scale to -w>1; kept
    # at 1 here conservatively. The single-global-budget invariant is enforced by
    # the worker (-p1 -t1), not the web tier. Dispatch is async (AC-W1-16a) — the
    # orchestration runs in the `worker` service below, not in this request thread.
    command: >
      gunicorn src.main:app
      -k uvicorn.workers.UvicornWorker
      -w 1
      -b 0.0.0.0:8000
      --access-logfile -
      --error-logfile -
      --graceful-timeout 30
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      otel-collector:
        condition: service_started

  # AC-W1-16a: Dramatiq worker — runs task orchestrations off-request. Same image
  # + secrets as backend; SSE_BACKEND=redis so its ledger reaches the web /stream.
  # -p1 -t1 enforces the workers=1 / single-global-budget invariant (F-ARC-H2).
  # :9191 exposes its Prometheus metrics (AC-W1-13), scraped via the oriion-worker
  # job in prometheus.yml — under async dispatch the orchestration runs here.
  worker:
    image: ${YC_CR_REGISTRY:-oriion-staging}/oriion-backend:${IMAGE_TAG:-latest}
    build:
      context: ../backend
      target: prod
    restart: always
    # Container hardening (ADR-014-security): same posture as the web tier — the
    # Dramatiq worker needs no extra privileges or capabilities.
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    environment:
      # AC-W1-9: the worker reads the SAME secrets from YC Lockbox at startup as
      # the backend (see that service) — not passed as env, nothing on disk.
      LOCKBOX_SECRET_ID: ${LOCKBOX_SECRET_ID:-}
      LOCKBOX_ENDPOINT: ${LOCKBOX_ENDPOINT:-}
      # Real LLM cost (AC-W1-13) prices via pricing_service × FX; the worker runs
      # the orchestration so it needs the FX rate in its env (non-secret config).
      FX_RATE_USD_TO_RUB: ${FX_RATE_USD_TO_RUB:-100.0}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: oriion-worker
      OTEL_TRACES_ENABLED: "true"
      LOG_FORMAT: json
      LOG_LEVEL: INFO
      APP_ENV: staging
      SSE_BACKEND: redis
      WORKER_METRICS_PORT: "9191"
    command: >
      dramatiq src.runtime.queue.worker
      --processes 1
      --threads 1
    expose:
      - "9191" # Prometheus /metrics (scraped by the oriion-worker job)
    depends_on:
      otel-collector:
        condition: service_started

  # Frontend skeleton lands в Phase 00.7. Compose profile `with-ui` gates
  # the service так что Stage A local validation can run без UI image
  # built. Once Phase 00.7 ships frontend/Dockerfile properly, founder
  # can enable via `--profile with-ui` flag on compose-up.
  frontend:
    image: ${YC_CR_REGISTRY:-oriion-staging}/oriion-frontend:${IMAGE_TAG:-latest}
    build:
      context: ../frontend
    restart: always
    profiles: ["with-ui"]

  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    environment:
      # Real ACME control (F-CR-M2 fix). Production (Stage B) VM .env sets
      # CADDY_SITE_ADDR=staging.${BRAND_DOMAIN} and leaves CADDY_GLOBAL_OPTS
      # unset → auto_https ON → Let's Encrypt. Local override flips both.
      # NOTE: `-` (not `:-`) so an explicitly-empty CADDY_GLOBAL_OPTS is honoured.
      CADDY_SITE_ADDR: ${CADDY_SITE_ADDR:-:80}
      CADDY_GLOBAL_OPTS: ${CADDY_GLOBAL_OPTS-}
      CADDY_ACME_EMAIL: ${CADDY_ACME_EMAIL:-deploy@oriion.dev}
      CADDY_ADMIN_LISTEN: ${CADDY_ADMIN_LISTEN:-0.0.0.0:2019}
      GRAFANA_BASIC_AUTH_USER: ${GRAFANA_BASIC_AUTH_USER:-admin}
      GRAFANA_BASIC_AUTH_BCRYPT: ${GRAFANA_BASIC_AUTH_BCRYPT:-}
    volumes:
      - ./caddy/Caddyfile.staging:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.105.0
    restart: always
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./observability/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    expose:
      - "4317" # OTLP gRPC
      - "4318" # OTLP HTTP
      - "8888" # Collector self-metrics (Prometheus scrape)

  prometheus:
    image: prom/prometheus:v2.55.0
    restart: always
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerting:/etc/prometheus/alerting:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    expose:
      - "9090"

  grafana:
    image: grafana/grafana:11.2.0
    restart: always
    environment:
      GF_SECURITY_ADMIN_USER: ${LOCKBOX_GRAFANA_ADMIN_USER:-admin}
      # ADR-014-security: no weak default — a missing secret fails the deploy.
      GF_SECURITY_ADMIN_PASSWORD: ${LOCKBOX_GRAFANA_ADMIN_PASSWORD:?LOCKBOX_GRAFANA_ADMIN_PASSWORD must be set}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_FEATURE_TOGGLES_ENABLE: traceqlEditor
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus
      - loki
      - tempo

  loki:
    image: grafana/loki:3.2.0
    restart: always
    volumes:
      - ./observability/loki.yaml:/etc/loki/loki.yaml:ro
      - loki_data:/loki
    command: ["-config.file=/etc/loki/loki.yaml"]
    expose:
      - "3100"

  tempo:
    image: grafana/tempo:2.6.0
    restart: always
    volumes:
      - ./observability/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo_data:/var/tempo
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    expose:
      - "3200" # Tempo HTTP API (for Grafana datasource)
      - "4317" # OTLP gRPC (Tempo can receive directly; we route via collector
               # but expose for direct-write debugging)

  # Alertmanager — Wave-0 SHIP с in-stack mock-receiver (logs alerts только).
  # PagerDuty/Telegram webhook wiring = Wave-1 hardening pin.
  alertmanager:
    image: prom/alertmanager:v0.27.0
    restart: always
    volumes:
      - ./observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    expose:
      - "9093"

volumes:
  caddy_data: {}
  caddy_config: {}
  prometheus_data: {}
  grafana_data: {}
  loki_data: {}
  tempo_data: {}
  alertmanager_data: {}

spec: cloudevents/1.0
context: multitenancy
description: |
  Domain events emitted by the `multitenancy` bounded context (organizations,
  cells, cell membership). CloudEvents 1.0 envelope per ADR-024 §3.

defaults:
  specversion: "1.0"
  source: oriion://contexts/multitenancy
  datacontenttype: application/json

events:
  - type: oriion.multitenancy.organization.created.v1
    description: A new organization was provisioned.
    data:
      type: object
      required: [organization_id, slug, plan_tier, created_by_user_id]
      properties:
        organization_id:     { type: string, format: uuid }
        slug:                { type: string }
        plan_tier:           { type: string, enum: [free, starter, pro, enterprise] }
        created_by_user_id:  { type: string, format: uuid }

  - type: oriion.multitenancy.organization.plan_changed.v1
    description: Subscription plan tier transitioned.
    data:
      type: object
      required: [organization_id, old_plan, new_plan, changed_at]
      properties:
        organization_id: { type: string, format: uuid }
        old_plan:        { type: string, enum: [free, starter, pro, enterprise] }
        new_plan:        { type: string, enum: [free, starter, pro, enterprise] }
        changed_at:      { type: string, format: date-time }

  - type: oriion.multitenancy.cell.created.v1
    description: A new cell (AI team workspace) was created.
    data:
      type: object
      required: [cell_id, organization_id, created_at]
      properties:
        cell_id:                 { type: string, format: uuid }
        organization_id:         { type: string, format: uuid }
        vertical_template_slug:  { type: string, nullable: true }
        created_at:              { type: string, format: date-time }

  - type: oriion.multitenancy.cell.archived.v1
    description: A cell was archived (soft state — not deletion).
    data:
      type: object
      required: [cell_id, archived_by, archived_at]
      properties:
        cell_id:      { type: string, format: uuid }
        archived_by:  { type: string, format: uuid }
        archived_at:  { type: string, format: date-time }

  - type: oriion.multitenancy.member.invited.v1
    description: An invitation was issued to join a cell.
    data:
      type: object
      required: [invitation_id, cell_id, email, role_id, invited_by]
      properties:
        invitation_id: { type: string, format: uuid }
        cell_id:       { type: string, format: uuid }
        email:         { type: string, format: email }
        role_id:       { type: string, format: uuid }
        invited_by:    { type: string, format: uuid }

  - type: oriion.multitenancy.member.joined.v1
    description: A user accepted an invitation and became a cell member.
    data:
      type: object
      required: [cell_id, user_id, role_id, joined_at]
      properties:
        cell_id:   { type: string, format: uuid }
        user_id:   { type: string, format: uuid }
        role_id:   { type: string, format: uuid }
        joined_at: { type: string, format: date-time }

  - type: oriion.multitenancy.member.role_changed.v1
    description: A member's system role was changed within a cell.
    data:
      type: object
      required: [cell_id, user_id, old_role_id, new_role_id, changed_by]
      properties:
        cell_id:     { type: string, format: uuid }
        user_id:     { type: string, format: uuid }
        old_role_id: { type: string, format: uuid }
        new_role_id: { type: string, format: uuid }
        changed_by:  { type: string, format: uuid }

  - type: oriion.multitenancy.member.removed.v1
    description: A user was removed from a cell.
    data:
      type: object
      required: [cell_id, user_id, removed_by, removed_at]
      properties:
        cell_id:     { type: string, format: uuid }
        user_id:     { type: string, format: uuid }
        removed_by:  { type: string, format: uuid }
        removed_at:  { type: string, format: date-time }

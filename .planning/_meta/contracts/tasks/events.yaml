specversion: "1.0"
context: tasks
description: |
  CloudEvents 1.0 emitted/consumed by the `tasks` bounded context.
  Naming: `agent_archetype_id` is canonical (ADR-024 §2 / P-AUDIT-2).

events:
  - type: oriion.tasks.task.queued.v1
    direction: emit
    description: Task created and enqueued.
    data_schema:
      type: object
      required: [task_id, cell_id, initiated_by_user_id, priority]
      properties:
        task_id:              { type: string, format: uuid }
        cell_id:              { type: string, format: uuid }
        agent_instance_id:    { type: string, format: uuid, nullable: true }
        team_preset_id:       { type: string, format: uuid, nullable: true }
        initiated_by_user_id: { type: string, format: uuid }
        priority:             { type: integer }

  - type: oriion.tasks.task.started.v1
    direction: emit
    description: First step transitioned to `running`.
    data_schema:
      type: object
      required: [task_id, started_at]
      properties:
        task_id:    { type: string, format: uuid }
        started_at: { type: string, format: date-time }

  - type: oriion.tasks.task.step_completed.v1
    direction: emit
    description: A step finished (success or failure).
    data_schema:
      type: object
      required: [task_id, step_id, step_index, agent_archetype_id, status, cost_usd, latency_ms]
      properties:
        task_id:             { type: string, format: uuid }
        step_id:             { type: string, format: uuid }
        step_index:          { type: integer }
        agent_archetype_id:  { type: string, format: uuid }
        status:              { type: string, enum: [succeeded, failed, skipped, cancelled] }
        cost_usd:            { type: number }
        latency_ms:          { type: integer }

  - type: oriion.tasks.task.waiting_input.v1
    direction: emit
    description: A step requires human input before continuing.
    data_schema:
      type: object
      required: [task_id, step_id, prompt_for_user]
      properties:
        task_id:         { type: string, format: uuid }
        step_id:         { type: string, format: uuid }
        prompt_for_user: { type: string }

  - type: oriion.tasks.task.succeeded.v1
    direction: emit
    description: Task completed successfully (terminal).
    data_schema:
      type: object
      required: [task_id, total_cost_usd, total_duration_ms, artifact_count]
      properties:
        task_id:           { type: string, format: uuid }
        total_cost_usd:    { type: number }
        total_duration_ms: { type: integer }
        artifact_count:    { type: integer }

  - type: oriion.tasks.task.failed.v1
    direction: emit
    description: Task failed (terminal). Retry creates a new task (invariant #5).
    data_schema:
      type: object
      required: [task_id, error_code]
      properties:
        task_id:               { type: string, format: uuid }
        error_code:            { type: string }
        failed_at_step_index:  { type: integer, nullable: true }
        failed_at_step_id:     { type: string, format: uuid, nullable: true }

  - type: oriion.tasks.task.cancelled.v1
    direction: emit
    description: Task cancelled by user or system (terminal).
    data_schema:
      type: object
      required: [task_id, cancelled_at, cancelled_by]
      properties:
        task_id:      { type: string, format: uuid }
        cancelled_at: { type: string, format: date-time }
        cancelled_by: { type: string, enum: [user, system, kill_switch] }

  - type: oriion.tasks.artifact.created.v1
    direction: emit
    description: A new artifact persisted.
    data_schema:
      type: object
      required: [artifact_id, task_id, artifact_type, storage_kind, byte_size]
      properties:
        artifact_id:    { type: string, format: uuid }
        task_id:        { type: string, format: uuid }
        step_id:        { type: string, format: uuid, nullable: true }
        artifact_type:  { type: string, enum: [text, image, file, structured_data, code] }
        storage_kind:   { type: string, enum: [inline, s3, yjs_document] }
        byte_size:      { type: integer }

  - type: oriion.llm-gateway.request.completed.v1
    direction: consume
    description: Used to reconcile `task_steps.cost_usd` and aggregate `tasks.total_cost_usd`.
    source_context: llm-gateway

  - type: oriion.billing.kill_switch.engaged.v1
    direction: consume
    description: On engage, all queued/running tasks are cancelled with cancelled_by=kill_switch.
    source_context: billing

  # === Vertical-prompt escalation events (Milestone D.5 — emit from vertical archetypes per DECISION-11 + adversarial probes) ===

  - type: oriion.research.category-not-found.v1
    direction: emit
    description: Researcher detected requested category does not exist in WB-catalog. Coordinator MUST NOT proceed to listing-writer; should respond `out-of-scope` to user. Adversarial probe A001 verifies this path.
    data_schema:
      type: object
      required: [task_id, category_hint_input]
      properties:
        task_id:             { type: string, format: uuid }
        category_hint_input: { type: string }
        researcher_evidence: { type: string, description: "Why category determined non-existent (e.g. catalog lookup failed)" }

  - type: oriion.research.stale-data.v1
    direction: emit
    description: Researcher detected cached data exceeds freshness TTL (90 days default for category rules; 24h for competitor snapshots). Coordinator MUST trigger re-research or escalate to founder. Adversarial probe A005 verifies this path.
    data_schema:
      type: object
      required: [task_id, stale_field, accessed_at, max_age_days]
      properties:
        task_id:        { type: string, format: uuid }
        stale_field:    { type: string, description: "e.g. category_commission_pct" }
        accessed_at:    { type: string, format: date-time }
        max_age_days:   { type: integer }
        suggested_action: { type: string, enum: [re-research, founder-escalation, partial-payload] }

  - type: oriion.write.legal-edge.v1
    direction: emit
    description: Listing-writer detected legal-edge content (defamation request, antitrust request, fraud-claim review, safety claim without certification). Coordinator MUST refuse downstream invocation and cite specific legal references. Adversarial probes A003 + A004 verify this path; golden task 024 covers defamatory review path.
    data_schema:
      type: object
      required: [task_id, edge_category, refusal_basis]
      properties:
        task_id:        { type: string, format: uuid }
        edge_category:  { type: string, enum: [defamation-request, antitrust-request, fraud-claim-review, safety-claim-without-cert, medical-claim, comparative-claim-named-competitor] }
        refusal_basis:  { type: array, items: { type: string }, description: "Cited legal/policy references (e.g. ст. 152 ГК РФ, ФЗ о защите конкуренции, WB community guidelines)" }
        suggested_legitimate_path: { type: string, nullable: true }

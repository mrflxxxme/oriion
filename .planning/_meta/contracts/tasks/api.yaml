openapi: 3.1.0
info:
  title: Oriion Tasks API
  version: 0.1.0-draft
  description: |
    Bounded context `tasks`. A task = one agent-team execution within a cell.
    Steps = ordered atomic operations. Artifacts = produced outputs.
    Authoritative spec per ADR-024.

servers:
  - url: https://api.oriion.local/v1

security:
  - bearerAuth: []

tags:
  - name: tasks
  - name: steps
  - name: artifacts

paths:
  /cells/{cell_id}/tasks:
    post:
      tags: [tasks]
      summary: Create (queue) a new task
      parameters:
        - in: path
          name: cell_id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaskCreateRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "400": { $ref: "#/components/responses/Error" }
    get:
      tags: [tasks]
      summary: List tasks in a cell
      parameters:
        - in: path
          name: cell_id
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: status
          schema: { type: string, enum: [queued, running, waiting_input, succeeded, failed, cancelled, timed_out] }
        - in: query
          name: from
          schema: { type: string, format: date-time }
        - in: query
          name: to
          schema: { type: string, format: date-time }
        - in: query
          name: limit
          schema: { type: integer, default: 50, maximum: 200 }
        - in: query
          name: cursor
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Task" }
                  next_cursor:
                    type: string
                    nullable: true

  /tasks/{task_id}:
    get:
      tags: [tasks]
      summary: Get task detail (steps embedded)
      parameters:
        - in: path
          name: task_id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/Task" }
                  - type: object
                    properties:
                      steps:
                        type: array
                        items: { $ref: "#/components/schemas/TaskStep" }

  /tasks/{task_id}/steps:
    get:
      tags: [steps]
      summary: List steps of a task
      parameters:
        - in: path
          name: task_id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TaskStep" }

  /tasks/{task_id}/artifacts:
    get:
      tags: [artifacts]
      summary: List artifacts produced by a task
      parameters:
        - in: path
          name: task_id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TaskArtifact" }

  /tasks/{task_id}/artifacts/{artifact_id}/content:
    get:
      tags: [artifacts]
      summary: Fetch artifact content (inline JSON or signed URL for S3/Yjs)
      parameters:
        - in: path
          name: task_id
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: artifact_id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArtifactContentResponse" }

  /tasks/{task_id}/cancel:
    post:
      tags: [tasks]
      summary: Cancel a running or queued task
      parameters:
        - in: path
          name: task_id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Cancelled }
        "409":
          description: Cannot cancel terminal task
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /tasks/{task_id}/steps/{step_id}/respond:
    post:
      tags: [steps]
      summary: Provide user input to a step in status `waiting_input`
      parameters:
        - in: path
          name: task_id
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: step_id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [response_jsonb]
              properties:
                response_jsonb:
                  type: object
                  additionalProperties: true
      responses:
        "200":
          description: Resumed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskStep" }
        "409":
          description: Step is not in `waiting_input` status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    TaskCreateRequest:
      type: object
      required: [title]
      properties:
        agent_instance_id: { type: string, format: uuid, nullable: true }
        team_preset_id:    { type: string, format: uuid, nullable: true }
        title:             { type: string, maxLength: 200 }
        description:       { type: string, nullable: true }
        input_jsonb:
          type: object
          additionalProperties: true
        priority:          { type: integer, minimum: 1, maximum: 9, default: 5 }

    Task:
      type: object
      required: [id, cell_id, title, status, created_at]
      properties:
        id:                  { type: string, format: uuid }
        cell_id:             { type: string, format: uuid }
        agent_instance_id:   { type: string, format: uuid, nullable: true }
        team_preset_id:      { type: string, format: uuid, nullable: true }
        initiated_by_user_id: { type: string, format: uuid }
        title:               { type: string }
        description:         { type: string }
        input_jsonb:         { type: object, additionalProperties: true }
        status:
          type: string
          enum: [queued, running, waiting_input, succeeded, failed, cancelled, timed_out]
        priority:            { type: integer }
        started_at:          { type: string, format: date-time, nullable: true }
        completed_at:        { type: string, format: date-time, nullable: true }
        total_cost_usd:      { type: number }
        total_input_tokens:  { type: integer }
        total_output_tokens: { type: integer }
        created_at:          { type: string, format: date-time }

    TaskStep:
      type: object
      required: [id, task_id, step_index, agent_archetype_id, step_type, status]
      properties:
        id:                  { type: string, format: uuid }
        task_id:             { type: string, format: uuid }
        step_index:          { type: integer }
        agent_archetype_id:  { type: string, format: uuid, description: "Snapshot, canonical FK name per ADR-024 §2." }
        step_type:
          type: string
          enum: [llm_call, tool_use, user_input, wait, branch, merge]
        input_jsonb:         { type: object, additionalProperties: true }
        output_jsonb:        { type: object, additionalProperties: true }
        status:
          type: string
          enum: [queued, running, waiting_input, succeeded, failed, skipped, cancelled]
        started_at:          { type: string, format: date-time, nullable: true }
        completed_at:        { type: string, format: date-time, nullable: true }
        cost_usd:            { type: number }
        error_jsonb:         { type: object, additionalProperties: true, nullable: true }

    TaskArtifact:
      type: object
      required: [id, task_id, artifact_type, storage_kind, mime_type, byte_size, content_hash_sha256]
      properties:
        id:                  { type: string, format: uuid }
        task_id:             { type: string, format: uuid }
        step_id:             { type: string, format: uuid, nullable: true }
        artifact_type:
          type: string
          enum: [text, image, file, structured_data, code]
        storage_kind:
          type: string
          enum: [inline, s3, yjs_document]
        mime_type:           { type: string }
        byte_size:           { type: integer }
        content_hash_sha256: { type: string }
        created_at:          { type: string, format: date-time }

    ArtifactContentResponse:
      oneOf:
        - type: object
          required: [storage_kind, content_inline]
          properties:
            storage_kind:   { type: string, enum: [inline] }
            content_inline: { type: object, additionalProperties: true }
        - type: object
          required: [storage_kind, signed_url, expires_at]
          properties:
            storage_kind: { type: string, enum: [s3, yjs_document] }
            signed_url:   { type: string, format: uri }
            expires_at:   { type: string, format: date-time }

    Error:
      type: object
      required: [code, message]
      properties:
        code:    { type: string }
        message: { type: string }
        details: { type: object, additionalProperties: true }

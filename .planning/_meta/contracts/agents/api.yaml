openapi: 3.1.0
info:
  title: Oriion Agents API
  version: 0.1.0-draft
  description: |
    Bounded context `agents`. Manages agent_archetypes (vertical-level AI personas),
    team_presets (opinionated compositions), and agent_instances (cell-level
    instantiations). Authoritative spec per ADR-024.

    Naming: column and field name is `agent_archetype_id` everywhere
    (deprecated aliases: `ui_sprite_archetype`, `sprite_id` — DO NOT USE).

servers:
  - url: https://api.oriion.local/v1

security:
  - bearerAuth: []

tags:
  - name: archetypes
  - name: presets
  - name: instances

paths:
  /agent-archetypes:
    get:
      tags: [archetypes]
      summary: List archetypes (filterable by vertical and status)
      parameters:
        - in: query
          name: vertical_slug
          schema: { type: string }
        - in: query
          name: status
          schema: { type: string, enum: [draft, reviewed, promoted, locked] }
        - in: query
          name: include_deprecated
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AgentArchetype" }

  /agent-archetypes/{id}:
    get:
      tags: [archetypes]
      summary: Get archetype detail (raw prompt body NOT included — lives in `_meta/verticals/`)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentArchetype" }
        "404": { $ref: "#/components/responses/Error" }

  /team-presets:
    get:
      tags: [presets]
      summary: List team presets
      parameters:
        - in: query
          name: vertical_slug
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TeamPreset" }

  /cells/{cell_id}/agent-instances:
    post:
      tags: [instances]
      summary: Spawn an agent_instance in a cell
      parameters:
        - in: path
          name: cell_id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agent_archetype_id]
              properties:
                agent_archetype_id:    { type: string, format: uuid }
                custom_name:           { type: string, maxLength: 80, nullable: true }
                custom_settings_jsonb: { type: object, additionalProperties: true, nullable: true }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentInstance" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    get:
      tags: [instances]
      summary: List agent_instances in a cell
      parameters:
        - in: path
          name: cell_id
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: include_archived
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AgentInstance" }

  /cells/{cell_id}/agent-instances/{id}:
    patch:
      tags: [instances]
      summary: Update custom_name / custom_settings of an agent_instance
      parameters:
        - in: path
          name: cell_id
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                custom_name:           { type: string, nullable: true }
                custom_settings_jsonb: { type: object, additionalProperties: true, nullable: true }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentInstance" }
    delete:
      tags: [instances]
      summary: Soft-archive an agent_instance
      parameters:
        - in: path
          name: cell_id
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Archived }

  /cells/{cell_id}/team-presets/{preset_id}/apply:
    post:
      tags: [presets]
      summary: Bulk-spawn agent_instances from a team preset
      parameters:
        - in: path
          name: cell_id
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: preset_id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApplyPresetResponse" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    AgentArchetype:
      type: object
      required: [id, slug, vertical_slug, display_name, role_category, prompt_version, model_provider_slug, model_name, status]
      properties:
        id:                  { type: string, format: uuid }
        slug:                { type: string }
        vertical_slug:       { type: string }
        display_name:        { type: string }
        role_category:
          type: string
          enum: [coordinator, researcher, writer, analyzer, validator, communicator]
        prompt_version:      { type: string, description: "semver, matches `_meta/verticals/.../prompts/<slug>.md` frontmatter" }
        model_provider_slug: { type: string }
        model_name:          { type: string }
        model_fallback:      { type: string, nullable: true }
        tools_allowed:
          type: array
          items: { type: string }
        is_active:           { type: boolean }
        status:
          type: string
          enum: [draft, reviewed, promoted, locked]
        created_at:          { type: string, format: date-time }
        deprecated_at:       { type: string, format: date-time, nullable: true }

    TeamPreset:
      type: object
      required: [id, vertical_slug, slug, display_name, archetype_ids]
      properties:
        id:                        { type: string, format: uuid }
        vertical_slug:             { type: string }
        slug:                      { type: string }
        display_name:              { type: string }
        description:               { type: string }
        archetype_ids:
          type: array
          items: { type: string, format: uuid }
        default_workflow_dag_json: { type: object, additionalProperties: true }

    AgentInstance:
      type: object
      required: [id, cell_id, agent_archetype_id, created_at]
      properties:
        id:                    { type: string, format: uuid }
        cell_id:               { type: string, format: uuid }
        agent_archetype_id:    { type: string, format: uuid, description: "Canonical FK name per ADR-024 §2." }
        custom_name:           { type: string, nullable: true }
        custom_settings_jsonb: { type: object, additionalProperties: true }
        total_tasks_completed: { type: integer }
        last_used_at:          { type: string, format: date-time, nullable: true }
        created_at:            { type: string, format: date-time }
        archived_at:           { type: string, format: date-time, nullable: true }

    ApplyPresetResponse:
      type: object
      required: [preset_id, created_instances]
      properties:
        preset_id: { type: string, format: uuid }
        created_instances:
          type: array
          items: { $ref: "#/components/schemas/AgentInstance" }

    Error:
      type: object
      required: [code, message]
      properties:
        code:    { type: string }
        message: { type: string }
        details: { type: object, additionalProperties: true }

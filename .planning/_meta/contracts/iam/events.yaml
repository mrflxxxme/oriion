spec: cloudevents/1.0
context: iam
description: |
  Domain events emitted by the `iam` bounded context. All events conform to
  CloudEvents 1.0 (https://github.com/cloudevents/spec). Transport in Wave 0
  is the in-process EventBus + Redis Streams; the same envelope works on
  NATS/Kafka in Wave 4 per ADR-024 §3.

defaults:
  specversion: "1.0"
  source: oriion://contexts/iam
  datacontenttype: application/json

events:
  - type: oriion.iam.user.registered.v1
    description: A new user finished the registration flow.
    data:
      type: object
      required: [user_id, email, registered_at, registration_source]
      properties:
        user_id:              { type: string, format: uuid }
        email:                { type: string, format: email }
        registered_at:        { type: string, format: date-time }
        registration_source:  { type: string, enum: [password, oauth_yandex, oauth_google, oauth_vk, oauth_gitlab, invite] }

  - type: oriion.iam.user.email_verified.v1
    description: User confirmed ownership of the email.
    data:
      type: object
      required: [user_id, verified_at]
      properties:
        user_id:     { type: string, format: uuid }
        verified_at: { type: string, format: date-time }

  - type: oriion.iam.session.created.v1
    description: A new login session was opened.
    data:
      type: object
      required: [session_id, user_id, expires_at]
      properties:
        session_id:        { type: string, format: uuid }
        user_id:           { type: string, format: uuid }
        ip:                { type: string, nullable: true }
        user_agent_class:  { type: string, description: "Coarse UA class (desktop / mobile / bot); no full UA string." }
        expires_at:        { type: string, format: date-time }

  - type: oriion.iam.session.revoked.v1
    description: A session was terminated.
    data:
      type: object
      required: [session_id, reason]
      properties:
        session_id: { type: string, format: uuid }
        reason:     { type: string, enum: [user_action, admin, security_incident, expired] }

  - type: oriion.iam.refresh.rotated.v1
    description: Refresh token rotated to a new one (single-use semantic).
    data:
      type: object
      required: [old_token_id, new_token_id, rotation_chain_id]
      properties:
        old_token_id:       { type: string, format: uuid }
        new_token_id:       { type: string, format: uuid }
        rotation_chain_id:  { type: string, format: uuid }

  - type: oriion.iam.oauth.linked.v1
    description: An external IdP identity was linked to a user.
    data:
      type: object
      required: [user_id, provider, provider_user_id]
      properties:
        user_id:           { type: string, format: uuid }
        provider:          { type: string, enum: [yandex, google, vk, gitlab] }
        provider_user_id:  { type: string }

  - type: oriion.iam.user.deleted.v1
    description: Soft-delete recorded; hard purge scheduled per retention policy.
    data:
      type: object
      required: [user_id, deleted_at, retention_policy_days]
      properties:
        user_id:                { type: string, format: uuid }
        deleted_at:             { type: string, format: date-time }
        retention_policy_days:  { type: integer, minimum: 0 }

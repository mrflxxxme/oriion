openapi: 3.1.0
info:
  title: Oriion RBAC API
  version: 0.1.0-draft
  summary: System-level role-based access control (system_roles, permissions, role_assignments).
  description: |
    Authoritative API contract for the `rbac` bounded context per ADR-024.

    Naming is STRICT (ADR-024 §2): `system_roles`, `permissions`,
    `role_assignments`. The deprecated terms `roles_rbac` / `roles_agent` /
    `ui_sprite_archetype` MUST NOT appear in implementations.

servers:
  - url: https://api.oriion.app

tags:
  - name: roles
    description: Built-in system role catalogue.
  - name: permissions
    description: Permission catalogue grouped by category.
  - name: assignments
    description: User ↔ scope ↔ role bindings.

security:
  - BearerAuth: []

paths:
  /system-roles:
    get:
      tags: [roles]
      summary: List built-in system roles.
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SystemRole' }

  /permissions:
    get:
      tags: [permissions]
      summary: List permissions grouped by category.
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PermissionCategoryGroup' }

  /role-assignments:
    get:
      tags: [assignments]
      summary: List role assignments within a scope.
      parameters:
        - name: scope_type
          in: query
          required: true
          schema:
            type: string
            enum: [workspace, cell]
        - name: scope_id
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          schema: { type: integer, default: 50, maximum: 200 }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoleAssignmentPage' }
    post:
      tags: [assignments]
      summary: Assign a user to a role within a scope.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoleAssignmentCreate' }
      responses:
        '201':
          description: Assigned.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoleAssignment' }
        '409':
          description: User already has this role in this scope.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: Scope/role mismatch (e.g. workspace-only role assigned at cell scope).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Error' }

  /role-assignments/{assignment_id}:
    delete:
      tags: [assignments]
      summary: Revoke a role assignment.
      parameters:
        - name: assignment_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: Revoked.
        '404':
          description: Not found.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Error' }

  /users/me/permissions:
    get:
      tags: [permissions]
      summary: Flat list of effective permission slugs for the caller in a scope.
      parameters:
        - name: scope_type
          in: query
          required: true
          schema:
            type: string
            enum: [workspace, cell]
        - name: scope_id
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                required: [scope_type, scope_id, permissions]
                properties:
                  scope_type:
                    type: string
                    enum: [workspace, cell]
                  scope_id:
                    type: string
                    format: uuid
                  permissions:
                    type: array
                    items: { type: string, example: cell.update }

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    SystemRole:
      type: object
      required: [id, slug, display_name, is_built_in]
      properties:
        id:            { type: string, format: uuid }
        slug:          { type: string, example: editor }
        display_name:  { type: string }
        description:   { type: string }
        is_built_in:   { type: boolean }
        created_at:    { type: string, format: date-time }

    Permission:
      type: object
      required: [id, slug, display_name, category]
      properties:
        id:           { type: string, format: uuid }
        slug:         { type: string, example: cell.update, pattern: '^[a-z][a-z0-9_]*\.[a-z][a-z0-9_]*$' }
        display_name: { type: string }
        description:  { type: string }
        category:     { type: string, example: cell }

    PermissionCategoryGroup:
      type: object
      required: [category, permissions]
      properties:
        category:    { type: string, example: cell }
        permissions:
          type: array
          items: { $ref: '#/components/schemas/Permission' }

    RoleAssignment:
      type: object
      required: [id, user_id, scope_type, scope_id, role_id, assigned_at]
      properties:
        id:           { type: string, format: uuid }
        user_id:      { type: string, format: uuid }
        scope_type:   { type: string, enum: [workspace, cell] }
        scope_id:     { type: string, format: uuid }
        role_id:      { type: string, format: uuid }
        role_slug:    { type: string, example: editor }
        assigned_by:  { type: string, format: uuid, nullable: true }
        assigned_at:  { type: string, format: date-time }
        expires_at:   { type: string, format: date-time, nullable: true }

    RoleAssignmentCreate:
      type: object
      required: [user_id, scope_type, scope_id, role_id]
      properties:
        user_id:    { type: string, format: uuid }
        scope_type: { type: string, enum: [workspace, cell] }
        scope_id:   { type: string, format: uuid }
        role_id:    { type: string, format: uuid }
        expires_at: { type: string, format: date-time, nullable: true }

    RoleAssignmentPage:
      type: object
      required: [items]
      properties:
        items:       { type: array, items: { $ref: '#/components/schemas/RoleAssignment' } }
        next_cursor: { type: string, nullable: true }

    Error:
      type: object
      required: [type, title, status]
      properties:
        type:     { type: string, format: uri }
        title:    { type: string }
        status:   { type: integer }
        detail:   { type: string }
        instance: { type: string, format: uri }
        code:     { type: string, example: rbac.assignment.scope_mismatch }

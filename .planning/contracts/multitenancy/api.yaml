openapi: 3.1.0
info:
  title: Oriion Multitenancy API
  version: 0.2.0-draft
  summary: Workspaces, cells, and cell membership management.
  description: |
    Authoritative API contract for the `multitenancy` bounded context per
    ADR-024. The cell is the primary tenancy boundary for billing, RLS, and
    quotas (ADR-009).

    NOTE (2026-05-19): renamed `organization` → `workspace` in DDL + API.
    Wave 0 has no public traffic so the rename is breaking-free.

servers:
  - url: https://api.oriion.app

tags:
  - name: workspaces
    description: Billing / legal tenant management.
  - name: cells
    description: Workspace (AI team) lifecycle.
  - name: members
    description: Cell membership and invitations.

security:
  - BearerAuth: []

paths:
  /workspaces:
    post:
      tags: [workspaces]
      summary: Create a new workspace.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkspaceCreate' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workspace' }
        '409':
          description: Slug already in use.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Error' }
    get:
      tags: [workspaces]
      summary: List workspaces the authenticated user has membership in.
      parameters:
        - { name: limit,  in: query, schema: { type: integer, default: 50, maximum: 200 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspacePage' }

  /workspaces/{workspace_id}/cells:
    parameters:
      - { name: workspace_id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [cells]
      summary: Create a cell in the given workspace.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CellCreate' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cell' }
    get:
      tags: [cells]
      summary: List cells visible to the caller within the workspace.
      parameters:
        - { name: limit,  in: query, schema: { type: integer, default: 50, maximum: 200 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CellPage' }

  /cells/{cell_id}/members:
    parameters:
      - { name: cell_id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [members]
      summary: List members of a cell.
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CellMember' }

  /cells/{cell_id}/members/invite:
    parameters:
      - { name: cell_id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [members]
      summary: Invite a user to a cell by email.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InvitationCreate' }
      responses:
        '201':
          description: Invitation created and email dispatched.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invitation' }
        '409':
          description: User is already a member.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Error' }

  /cells/{cell_id}/members/accept:
    parameters:
      - { name: cell_id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [members]
      summary: Accept an invitation (caller becomes a member).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [invite_token]
              properties:
                invite_token: { type: string }
      responses:
        '200':
          description: Membership created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CellMember' }
        '410':
          description: Invitation expired or revoked.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Error' }

  /cells/{cell_id}/members/{user_id}:
    parameters:
      - { name: cell_id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: user_id, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [members]
      summary: Change a member's role.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role_id]
              properties:
                role_id: { type: string, format: uuid }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CellMember' }
    delete:
      tags: [members]
      summary: Remove a member from the cell.
      responses:
        '204':
          description: Removed.

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Workspace:
      type: object
      required: [id, slug, display_name, plan_tier, created_at]
      properties:
        id:             { type: string, format: uuid }
        slug:           { type: string }
        display_name:   { type: string }
        billing_email:  { type: string, format: email, nullable: true }
        country_code:   { type: string, example: RU }
        timezone:       { type: string, example: Europe/Moscow }
        plan_tier:      { type: string, enum: [free, starter, pro, enterprise] }
        created_at:     { type: string, format: date-time }
        updated_at:     { type: string, format: date-time }

    WorkspaceCreate:
      type: object
      required: [display_name]
      properties:
        slug:          { type: string }
        display_name:  { type: string }
        billing_email: { type: string, format: email }
        plan_tier:     { type: string, enum: [free, starter, pro, enterprise], default: free }

    WorkspacePage:
      type: object
      required: [items]
      properties:
        items:       { type: array, items: { $ref: '#/components/schemas/Workspace' } }
        next_cursor: { type: string, nullable: true }

    Cell:
      type: object
      required: [id, workspace_id, slug, display_name, created_at]
      properties:
        id:                       { type: string, format: uuid }
        workspace_id:             { type: string, format: uuid }
        slug:                     { type: string }
        display_name:             { type: string }
        vertical_template_slug:   { type: string, nullable: true, example: wb-seller }
        settings:                 { type: object, additionalProperties: true }
        created_at:               { type: string, format: date-time }
        updated_at:               { type: string, format: date-time }
        archived_at:              { type: string, format: date-time, nullable: true }

    CellCreate:
      type: object
      required: [slug, display_name]
      properties:
        slug:                   { type: string }
        display_name:           { type: string }
        vertical_template_slug: { type: string, example: wb-seller }
        settings:               { type: object, additionalProperties: true }

    CellPage:
      type: object
      required: [items]
      properties:
        items:       { type: array, items: { $ref: '#/components/schemas/Cell' } }
        next_cursor: { type: string, nullable: true }

    CellMember:
      type: object
      required: [id, cell_id, user_id, role_id, joined_at]
      properties:
        id:              { type: string, format: uuid }
        cell_id:         { type: string, format: uuid }
        user_id:         { type: string, format: uuid }
        role_id:         { type: string, format: uuid }
        joined_at:       { type: string, format: date-time }
        invited_by:      { type: string, format: uuid, nullable: true }
        last_active_at:  { type: string, format: date-time, nullable: true }

    InvitationCreate:
      type: object
      required: [email, role_id]
      properties:
        email:   { type: string, format: email }
        role_id: { type: string, format: uuid }

    Invitation:
      type: object
      required: [id, cell_id, email, role_id, expires_at, created_at]
      properties:
        id:         { type: string, format: uuid }
        cell_id:    { type: string, format: uuid }
        email:      { type: string, format: email }
        role_id:    { type: string, format: uuid }
        expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }

    Error:
      type: object
      required: [type, title, status]
      properties:
        type:     { type: string, format: uri }
        title:    { type: string }
        status:   { type: integer }
        detail:   { type: string }
        instance: { type: string, format: uri }
        code:     { type: string, example: multitenancy.cell.slug_conflict }

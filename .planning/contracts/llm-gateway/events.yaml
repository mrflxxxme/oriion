specversion: "1.0"
context: llm-gateway
description: |
  CloudEvents 1.0 emitted/consumed by the llm-gateway bounded context.
  Transport: in-process EventBus + Redis Streams (Wave 0). Future: NATS/Kafka.

events:
  - type: oriion.llm-gateway.request.completed.v1
    direction: emit
    description: Every LLM call, success or failure, after usage log persisted.
    data_schema:
      type: object
      required: [request_id, organization_id, cell_id, provider_slug, model, status, cost_usd, latency_ms, input_tokens, output_tokens]
      properties:
        request_id:      { type: string }
        organization_id: { type: string, format: uuid }
        cell_id:         { type: string, format: uuid }
        task_id:         { type: string, format: uuid, nullable: true }
        byok_key_id:     { type: string, format: uuid, nullable: true }
        provider_slug:   { type: string }
        model:           { type: string }
        status:          { type: string, enum: [success, error, timeout, rate_limited] }
        cost_usd:        { type: number }
        latency_ms:      { type: integer }
        input_tokens:    { type: integer }
        output_tokens:   { type: integer }

  - type: oriion.llm-gateway.byok.created.v1
    direction: emit
    description: BYOK key registered for an organization.
    data_schema:
      type: object
      required: [byok_key_id, organization_id, provider_slug, label, created_by]
      properties:
        byok_key_id:     { type: string, format: uuid }
        organization_id: { type: string, format: uuid }
        provider_slug:   { type: string }
        label:           { type: string }
        created_by:      { type: string, format: uuid }

  - type: oriion.llm-gateway.byok.quota_warning.v1
    direction: emit
    description: BYOK soft-quota crossed warning threshold (best-effort).
    data_schema:
      type: object
      required: [byok_key_id, organization_id, percent_used, monthly_used_usd, monthly_quota_usd]
      properties:
        byok_key_id:       { type: string, format: uuid }
        organization_id:   { type: string, format: uuid }
        percent_used:      { type: number, minimum: 0, maximum: 200 }
        monthly_used_usd:  { type: number }
        monthly_quota_usd: { type: number }

  - type: oriion.llm-gateway.byok.quota_exceeded.v1
    direction: emit
    description: BYOK soft-quota exceeded. Does NOT fail-closed by itself (see invariant #4).
    data_schema:
      type: object
      required: [byok_key_id, organization_id, monthly_used_usd, monthly_quota_usd]
      properties:
        byok_key_id:       { type: string, format: uuid }
        organization_id:   { type: string, format: uuid }
        monthly_used_usd:  { type: number }
        monthly_quota_usd: { type: number }

  - type: oriion.llm-gateway.provider.degraded.v1
    direction: emit
    description: Provider error_rate > 5% over a 5-minute window; auto-failover triggered.
    data_schema:
      type: object
      required: [provider_slug, error_rate_pct, window_started_at, failover_to]
      properties:
        provider_slug:      { type: string }
        error_rate_pct:     { type: number }
        window_started_at:  { type: string, format: date-time }
        failover_to:        { type: string, nullable: true, description: "Alternative provider_slug if available" }

  - type: oriion.billing.kill_switch.engaged.v1
    direction: consume
    description: |
      Cost-policy kill-switch from billing/cost-budget enforcement.
      Gateway switches all platform-paid calls to refuse mode while engaged.
    source_context: billing

openapi: 3.1.0
info:
  title: Oriion LLM Gateway API
  version: 0.2.0-draft
  description: |
    Unified gateway for LLM provider routing, BYOK key management,
    and per-request usage telemetry. Authoritative spec for bounded
    context `llm-gateway` (ADR-024).

    NAMING (2026-05-19): `organization` renamed to `workspace` to match the
    multitenancy DDL rename. The `/cells/{id}/byok-keys` route is the
    canonical surface; legacy `/organizations/...` routes are not used.

    CURRENCY (2026-05-19, per ADR-018 amendment): responses return BOTH
    `cost_usd` (provider native) and `cost_rub` (customer-facing settlement)
    alongside the `fx_rate_usd_to_rub` snapshot used for conversion.
servers:
  - url: https://api.oriion.local/v1
    description: Local dev

security:
  - bearerAuth: []

tags:
  - name: providers
  - name: byok
  - name: inference
  - name: usage

paths:
  /llm/providers:
    get:
      tags: [providers]
      summary: List active LLM providers
      parameters:
        - in: query
          name: feature
          schema: { type: string, enum: [chat, embeddings, structured_output, tool_use, vision] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Provider" }

  /llm/providers/status:
    get:
      tags: [providers]
      summary: Per-provider health and circuit-breaker state
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ProviderStatus" }

  /llm/byok-keys:
    post:
      tags: [byok]
      summary: Register a BYOK key (encrypted server-side, never echoed)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BYOKKeyCreateRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BYOKKey" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    get:
      tags: [byok]
      summary: List BYOK keys for the current workspace (raw key never returned)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/BYOKKey" }

  /llm/byok-keys/{id}:
    delete:
      tags: [byok]
      summary: Revoke a BYOK key (soft delete via revoked_at)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Revoked }
        "404": { $ref: "#/components/responses/Error" }

  /llm/chat/completions:
    post:
      tags: [inference]
      summary: Proxy a chat completion through the gateway (OpenAI-compatible shape)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChatCompletionRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatCompletionResponse" }
        "402":
          description: Quota exceeded (BYOK or platform pool)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "502":
          description: Upstream provider error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /llm/embeddings:
    post:
      tags: [inference]
      summary: Generate embeddings via gateway
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmbeddingRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmbeddingResponse" }

  /llm/usage:
    get:
      tags: [usage]
      summary: Aggregated usage stats for the current workspace
      parameters:
        - in: query
          name: from
          schema: { type: string, format: date-time }
          required: true
        - in: query
          name: to
          schema: { type: string, format: date-time }
          required: true
        - in: query
          name: group_by
          schema: { type: string, enum: [provider, model, cell, byok_key, day] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UsageStats" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Provider:
      type: object
      required: [provider_slug, display_name, default_model, is_byok_supported, supported_features]
      properties:
        provider_slug:       { type: string, example: deepseek }
        display_name:        { type: string }
        default_model:       { type: string }
        base_url:            { type: string, format: uri }
        is_byok_supported:   { type: boolean }
        supported_features:
          type: array
          items: { type: string, enum: [chat, embeddings, structured_output, tool_use, vision] }

    ProviderStatus:
      type: object
      required: [provider_slug, state, circuit, last_check]
      properties:
        provider_slug: { type: string }
        state:         { type: string, enum: [healthy, degraded, down] }
        circuit:       { type: string, enum: [closed, open, half_open] }
        last_check:    { type: string, format: date-time }

    BYOKKeyCreateRequest:
      type: object
      required: [provider_slug, raw_api_key, label]
      properties:
        provider_slug:       { type: string }
        raw_api_key:         { type: string, writeOnly: true, description: "Never returned in any response" }
        label:               { type: string, maxLength: 80 }
        monthly_quota_usd:
          type: number
          format: double
          nullable: true
          description: "TECHNICAL soft-quota (provider-side USD). NOT a policy cap; policy lives in cost-budget.yaml."

    BYOKKey:
      type: object
      required: [id, provider_slug, key_fingerprint, label, is_active, created_at]
      properties:
        id:                  { type: string, format: uuid }
        provider_slug:       { type: string }
        key_fingerprint:     { type: string, description: "sha256(raw_key)[:8]" }
        label:               { type: string }
        monthly_quota_usd:   { type: number, nullable: true }
        monthly_used_usd:    { type: number }
        is_active:           { type: boolean }
        created_at:          { type: string, format: date-time }
        revoked_at:          { type: string, format: date-time, nullable: true }

    ChatCompletionRequest:
      type: object
      required: [messages]
      properties:
        provider_slug:       { type: string, nullable: true, description: "Override default routing" }
        model:               { type: string, nullable: true }
        byok_key_id:         { type: string, format: uuid, nullable: true }
        messages:
          type: array
          items:
            type: object
            required: [role, content]
            properties:
              role:    { type: string, enum: [system, user, assistant, tool] }
              content: { type: string }
        temperature:         { type: number, nullable: true }
        max_tokens:          { type: integer, nullable: true }
        tools:               { type: array, items: { type: object }, nullable: true }
        stream:              { type: boolean, default: false }

    ChatCompletionResponse:
      type: object
      required: [request_id, provider_slug, model, choices, usage]
      properties:
        request_id:          { type: string }
        provider_slug:       { type: string }
        model:               { type: string }
        choices:
          type: array
          items:
            type: object
            properties:
              index:   { type: integer }
              message:
                type: object
                properties:
                  role:    { type: string }
                  content: { type: string }
              finish_reason: { type: string }
        usage:
          type: object
          properties:
            input_tokens:         { type: integer }
            output_tokens:        { type: integer }
            cached_input_tokens:  { type: integer }
            cost_usd:             { type: number }
            cost_rub:             { type: number }
            fx_rate_usd_to_rub:   { type: number }
            latency_ms:           { type: integer }

    EmbeddingRequest:
      type: object
      required: [provider_slug, model, input]
      properties:
        provider_slug: { type: string }
        model:         { type: string }
        input:
          oneOf:
            - { type: string }
            - { type: array, items: { type: string } }

    EmbeddingResponse:
      type: object
      required: [request_id, model, data, usage]
      properties:
        request_id: { type: string }
        model:      { type: string }
        data:
          type: array
          items:
            type: object
            properties:
              index:     { type: integer }
              embedding: { type: array, items: { type: number } }
        usage:
          type: object
          properties:
            input_tokens:       { type: integer }
            cost_usd:           { type: number }
            cost_rub:           { type: number }
            fx_rate_usd_to_rub: { type: number }

    UsageStats:
      type: object
      properties:
        from: { type: string, format: date-time }
        to:   { type: string, format: date-time }
        group_by: { type: string }
        rows:
          type: array
          items:
            type: object
            properties:
              key:             { type: string }
              total_input:     { type: integer }
              total_output:    { type: integer }
              total_cost_usd:  { type: number }
              total_cost_rub:  { type: number }
              call_count:      { type: integer }

    Error:
      type: object
      required: [code, message]
      properties:
        code:    { type: string }
        message: { type: string }
        details: { type: object, additionalProperties: true }
